name: Espelhar para o GitLab

# A cada push (qualquer branch ou tag) replica o repositório para o GitLab da
# ZeroUm, que é a cópia usada pelo deploy. O GitHub segue sendo onde se edita.
#
# Requer os secrets do repositório:
#   GITLAB_USER  - nome do project access token (github-mirror-push)
#   GITLAB_TOKEN - o token, com escopo write_repository

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar branches e tags para o GitLab
        env:
          GITLAB_USER: ${{ secrets.GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://${GITLAB_USER}:${GITLAB_TOKEN}@git.zr1.bet/deolane-beauty/deobeauty-portal.git"
          # --mirror não serve aqui: o checkout traz refs/remotes/origin/*, que o
          # GitLab rejeita como hidden refs. Empurramos heads e tags explicitamente.
          git push --force --prune "$remote" "refs/remotes/origin/*:refs/heads/*" 2>&1 | sed "s/${GITLAB_TOKEN}/***/g"
          git push --force --tags "$remote" 2>&1 | sed "s/${GITLAB_TOKEN}/***/g"
