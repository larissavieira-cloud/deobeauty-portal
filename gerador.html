<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeoBeauty · Gerador de Estáticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Recline é a fonte da marca e não vem do Google Fonts.
   Coloque os arquivos em assets/ dentro do repositório e ela entra sozinha.
   Sem os arquivos, o navegador usa Cormorant Garamond, que é o fallback
   já adotado no portal. */
@font-face{
  font-family:'Recline';
  src:url('assets/Recline.woff2') format('woff2'),
      url('assets/Recline.woff') format('woff'),
      url('assets/Recline.ttf') format('truetype');
  font-weight:400 700;
  font-display:swap;
}

:root{
  --serif:'Recline','Cormorant Garamond',Georgia,serif;
  --sans:'Poppins',system-ui,-apple-system,sans-serif;
  /* marca */
  --dourado:#B8956A;
  --marrom:#6B4E3D;
  --preto:#141414;
  --creme:#F8F5EE;
  --marfim:#EFE8DC;
  --rosa:#E8C9C4;
  --branco:#FFFFFF;
  --vermelho:#B22222;
  /* chrome do app */
  --app-bg:#171311;
  --app-panel:#201A17;
  --app-linha:#312823;
  --app-txt:#EDE4D9;
  --app-txt-fraco:#9A8B7D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--app-bg);
  color:var(--app-txt);
  font-family:var(--sans);
  font-size:14px;
  display:grid;
  grid-template-columns:372px 1fr;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}

/* ---------- RAIL ---------- */
#rail{
  background:var(--app-panel);
  border-right:1px solid var(--app-linha);
  height:100vh;display:flex;flex-direction:column;
}
#railTopo{padding:18px 20px 14px;border-bottom:1px solid var(--app-linha)}
#railTopo h1{
  margin:0;font-family:var(--serif);
  font-size:24px;font-weight:600;letter-spacing:.14em;color:var(--creme);
}
#railTopo p{margin:3px 0 0;color:var(--app-txt-fraco);font-size:12.5px;letter-spacing:.04em}

#abas{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px;border-bottom:1px solid var(--app-linha)}
.aba{
  background:transparent;border:1px solid var(--app-linha);color:var(--app-txt-fraco);
  border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;transition:.15s;
}
.aba:hover{border-color:var(--dourado);color:var(--creme)}
.aba[aria-selected="true"]{background:var(--dourado);border-color:var(--dourado);color:#2A1E14;font-weight:600}

#campos{flex:1;overflow-y:auto;padding:16px 20px 26px}
#campos::-webkit-scrollbar{width:9px}
#campos::-webkit-scrollbar-thumb{background:var(--app-linha);border-radius:9px}

.grupo{margin-bottom:22px}
.grupo > h2{
  margin:0 0 11px;font-size:11px;letter-spacing:.18em;font-weight:600;
  color:var(--dourado);text-transform:uppercase;
}
.campo{margin-bottom:11px}
.campo label{display:block;margin-bottom:4px;color:var(--app-txt-fraco);font-size:12px}
.campo input[type=text],.campo input[type=number],.campo select,.campo textarea{
  width:100%;background:#120E0C;border:1px solid var(--app-linha);
  border-radius:7px;padding:8px 10px;transition:border-color .15s;
}
.campo textarea{min-height:128px;resize:vertical;line-height:1.55;font-size:13px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--dourado);outline:none}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.dica{color:var(--app-txt-fraco);font-size:11.5px;line-height:1.5;margin:6px 0 0}
.check{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer;color:var(--app-txt-fraco)}
.check input{accent-color:var(--dourado);width:15px;height:15px}

.btn{
  width:100%;background:var(--dourado);color:#2A1E14;border:none;border-radius:7px;
  padding:10px;font-weight:600;cursor:pointer;letter-spacing:.03em;transition:.15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.vazado{background:transparent;border:1px solid var(--app-linha);color:var(--app-txt)}
.btn.vazado:hover{border-color:var(--dourado);filter:none}
.btn + .btn{margin-top:8px}

.avisoBox{
  background:#2A1E14;border:1px solid #47331F;border-radius:8px;
  padding:10px 12px;font-size:12px;line-height:1.55;color:#E3CDA9;margin-bottom:14px;
}

/* ---------- PALCO ---------- */
#palco{height:100vh;display:flex;flex-direction:column;overflow:hidden}
#barra{
  display:flex;align-items:center;gap:10px;padding:12px 22px;
  border-bottom:1px solid var(--app-linha);background:var(--app-panel);flex-wrap:wrap;
}
#barra select,#barra button{
  background:#120E0C;border:1px solid var(--app-linha);border-radius:7px;padding:7px 11px;cursor:pointer;
}
#barra button:hover{border-color:var(--dourado)}
#barra .spacer{flex:1}
#barra .primario{background:var(--dourado);border-color:var(--dourado);color:#2A1E14;font-weight:600}
#zoomLbl{color:var(--app-txt-fraco);font-size:12px;min-width:42px;text-align:center}

#area{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:36px;flex-wrap:wrap;gap:0 24px;align-content:flex-start}
#conf{width:100%;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:18px}
#conf span{font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid}
#conf .ok{color:#8FC98B;border-color:#2F4A2D;background:#152015}
#conf .alerta{color:#E6B26B;border-color:#5A4322;background:#2A1E10}
#conf .conar{color:#E88A7A;border-color:#5E2E28;background:#2A1512}
#conf .marca{color:#D9B8A0;border-color:#4E3A2C;background:#241A14}
#conf .dica{color:#9A8B7D;border-color:var(--app-linha);background:#1A1512}
#area::-webkit-scrollbar{width:11px;height:11px}
#area::-webkit-scrollbar-thumb{background:var(--app-linha);border-radius:9px}
#moldura{transform-origin:top center;transition:transform .12s}

/* ---------- CANVAS ---------- */
#canvas{
  width:1080px;position:relative;overflow:hidden;background:var(--creme);
  box-shadow:0 26px 70px rgba(0,0,0,.6);
  font-family:var(--serif);color:var(--preto);
}
#canvas.f45{height:1350px}
#canvas.f11{height:1080px}
#canvas.f916{height:1920px}
.tpl{display:none;position:absolute;inset:0}
.tpl.on{display:block}

/* safezones */
#safe{position:absolute;inset:0;pointer-events:none;z-index:90;display:none}
#safe.on{display:block}
#safe div{position:absolute;left:0;right:0;background:rgba(178,34,34,.13);border-color:rgba(178,34,34,.55);border-style:dashed}
#safe .topo{top:0;border-bottom-width:2px;border-width:0 0 2px}
#safe .base{bottom:0;border-top-width:2px;border-width:2px 0 0}
#safe span{position:absolute;right:16px;font-family:var(--sans);font-size:19px;letter-spacing:.14em;color:rgba(178,34,34,.85)}

/* marca d'água de logo */
.dbLogo{font-family:var(--serif);letter-spacing:.34em;font-weight:600}

/* ===== CRIATIVO 1 — confronto ===== */
#t1{background:#F8F2DA;padding:54px 56px;display:flex;flex-direction:column}
#t1 .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
#t1 .topo .marca{font-size:29px;letter-spacing:.34em;font-weight:600}
#t1 .topo .site{font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.16em;color:var(--preto)}
#t1 .kick{font-family:var(--sans);font-weight:700;font-size:23px;letter-spacing:.06em;color:var(--vermelho);margin-bottom:4px}
#t1 h2{
  font-family:var(--serif);font-weight:700;font-size:102px;line-height:.94;
  margin:0 0 20px;letter-spacing:-.012em;text-transform:uppercase;
}
#t1 .arena{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:start;min-height:0;position:relative}
#t1 .lado{padding-top:26px}
#t1 .lado .rot{display:block;font-family:var(--sans);font-weight:700;font-size:20px;letter-spacing:.09em;margin-bottom:2px}
#t1 .esq .rot{color:#6E6459}
#t1 .dir .rot{color:var(--vermelho)}
#t1 .lado .pre{display:block;font-family:var(--serif);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.008em;margin-bottom:18px}
#t1 .esq .pre{color:#6E6459}
#t1 .lado .li{font-family:var(--sans);font-size:22px;font-weight:500;padding:5px 0;line-height:1.3}
#t1 .esq .li{color:#7A7065}
#t1 .esq .li::before{content:"×";color:#A89C8E;font-weight:700;margin-right:9px}
#t1 .dir .li::after{content:" ✓";color:#2E7D32;font-weight:700}
#t1 .frascoBox{display:flex;align-items:flex-start;justify-content:center;height:100%;min-height:0;padding-top:4px}
#t1 .frascoBox img{max-height:560px;max-width:100%;object-fit:contain;filter:drop-shadow(0 26px 34px rgba(0,0,0,.24))}
#t1 .selo{
  position:absolute;right:0;bottom:24px;width:186px;height:186px;border-radius:50%;
  background:var(--vermelho);color:#fff;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:var(--sans);box-shadow:0 12px 28px rgba(0,0,0,.2);
}
#t1 .selo b{font-size:48px;line-height:1;font-weight:700}
#t1 .selo span{font-size:17px;margin-top:3px}
#t1 .rodape{margin-top:26px;text-align:center}
#t1 .cta{
  display:inline-block;background:#fff;color:var(--preto);font-family:var(--sans);
  font-weight:700;font-size:27px;letter-spacing:.05em;padding:20px 66px;border-radius:999px;
  box-shadow:0 6px 20px rgba(0,0,0,.09);
}
#t1 .tag{font-family:var(--sans);font-size:20px;color:#5F564C;margin-top:20px}
#t1 .legal{font-family:var(--sans);font-size:16px;color:#8A8074;margin-top:14px}

/* ===== CRIATIVO 2 — print ===== */
#t2{background:#F4F1EA;display:flex;flex-direction:column}
#t2 .barra{background:#F6F4F1;padding:20px 26px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #E2DCD3}
#t2 .voltar{font-size:30px;color:#8C8378;line-height:1;margin-right:2px}
#t2 .av{width:56px;height:56px;border-radius:50%;background:#C3BCD4;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:23px;font-weight:600;overflow:hidden;flex:none}
#t2 .av img{width:100%;height:100%;object-fit:cover}
#t2 .quem{font-family:var(--sans);line-height:1.15}
#t2 .quem b{display:block;font-size:26px;font-weight:600;color:#17150F}
#t2 .quem span{font-size:17px;color:#8C8378}
#t2 .fluxo{
  flex:1;padding:24px 26px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:11px;overflow:hidden;
  background-color:#D8D0C4;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.4) 2.5px,transparent 3px),
                   radial-gradient(circle at 68% 42%,rgba(255,255,255,.34) 2px,transparent 2.5px),
                   radial-gradient(circle at 34% 78%,rgba(255,255,255,.3) 2.5px,transparent 3px);
  background-size:230px 260px,190px 210px,270px 240px;
}
#t2 .bal{
  max-width:66%;padding:14px 17px 24px;border-radius:11px;position:relative;
  font-family:var(--sans);font-size:25px;line-height:1.36;color:#17150F;
  box-shadow:0 1px 1px rgba(0,0,0,.09);
}
#t2 .bal .hr{position:absolute;right:13px;bottom:6px;font-size:15px;color:#9A9287}
#t2 .rec{background:#FFFFFF;align-self:flex-start;border-top-left-radius:3px}
#t2 .env{background:#E4F2D2;align-self:flex-end;border-top-right-radius:3px}
#t2 .env .hr{color:#8A9A78}
#t2 .env .hr::after{content:" ✓✓";color:#4D9FE0;letter-spacing:-.12em}
#t2 .bal.foto{padding:7px 7px 24px;background:#E4F2D2;align-self:flex-end;max-width:40%}
#t2 .bal.foto img{width:100%;border-radius:7px;display:block;background:#fff;aspect-ratio:1/1.14;object-fit:contain}
#t2 .encenacao{align-self:center;background:rgba(23,21,15,.62);color:#F3EDE4;font-family:var(--sans);font-size:17px;letter-spacing:.05em;padding:6px 18px;border-radius:999px;margin-bottom:6px}
#t2 .pe{background:#F4F1EA;padding:20px 40px 30px;text-align:center}
#t2 .pe .marca{font-size:22px;letter-spacing:.34em;margin-bottom:14px;display:block;color:#3A342C}
#t2 .cta{display:block;background:#17150F;color:#F4F1EA;font-family:var(--sans);font-weight:600;font-size:26px;letter-spacing:.12em;padding:20px;border-radius:999px}

/* ===== CRIATIVO 3 — manchete ===== */
#t3{background:#F2EFE8;display:flex;flex-direction:column;padding:44px 40px 40px}
#t3 .cab{background:#111110;color:#F2EFE8;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;flex:none}
#t3 .cab .esq{display:flex;align-items:center;gap:18px}
#t3 .cab .marca{font-size:26px;letter-spacing:.3em}
#t3 .cab .news{font-family:var(--sans);font-size:26px;letter-spacing:.42em;font-weight:600}
#t3 .cab .data{font-family:var(--sans);font-size:15px;letter-spacing:.1em;color:#BDB4A6}
#t3 .corpo{padding:30px 0 0;flex:1;display:flex;flex-direction:column;min-height:0}
#t3 .ed{font-family:var(--sans);font-weight:700;font-size:18px;letter-spacing:.16em;color:#C62828;margin-bottom:14px}
#t3 h2{
  font-family:var(--serif);font-weight:700;font-size:70px;line-height:1.06;
  margin:0 0 22px;text-transform:uppercase;letter-spacing:.004em;color:#141210;
}
#t3 .risco{height:1px;background:#CFC7B9;margin-bottom:24px;flex:none}
#t3 .foto{background:#E7E2D8;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:26px}
#t3 .foto img{max-height:100%;max-width:62%;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.18))}
#t3 .cred{font-family:var(--sans);font-size:15.5px;color:#8C8577;margin:14px 0 18px;line-height:1.4}
#t3 .lead{font-family:var(--sans);font-size:23px;line-height:1.58;color:#39352E;max-width:66ch}
#t3 .lead b{font-weight:600;color:#141210}
#t3 .pe{padding:26px 0 0;flex:none}
#t3 .cta{display:block;background:#111110;color:#F2EFE8;text-align:center;font-family:var(--sans);font-weight:600;font-size:25px;letter-spacing:.16em;padding:22px;border-radius:999px}

/* ===== CRIATIVO 4 — vapor ===== */
#t4{background:#6E6862;position:relative;overflow:hidden}
#t4 .bg{position:absolute;inset:0;background-size:cover;background-position:center}
#t4 .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.03) 40%,rgba(0,0,0,.34) 100%)}
#t4 .cont{position:absolute;inset:0;padding:78px 58px 0;display:flex;flex-direction:column}
#t4 h2{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
#t4 h2 .ln{
  font-family:'Caveat',var(--serif);font-weight:700;text-transform:uppercase;
  color:rgba(38,33,29,.84);line-height:1.02;letter-spacing:.012em;
  text-shadow:0 1px 0 rgba(255,255,255,.34), 0 0 14px rgba(255,255,255,.22);
}
#t4 h2 .ln:nth-child(odd){font-size:88px;transform:rotate(-1.6deg)}
#t4 h2 .ln:nth-child(even){font-size:76px;transform:rotate(-.6deg) translateX(14px)}
#t4 h2 .ln u{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
#t4 .nota{
  background:#FAF7F0;color:#2B2622;width:452px;padding:24px 26px 20px;margin-top:38px;
  font-family:var(--sans);box-shadow:0 18px 40px rgba(0,0,0,.36);transform:rotate(-2.4deg);position:relative;
}
#t4 .nota .rot{font-size:15px;font-weight:700;letter-spacing:.13em;color:#C62828;text-transform:uppercase;margin-bottom:3px}
#t4 .nota .tx{font-size:21px;line-height:1.38;margin-bottom:15px}
#t4 .nota .fio{height:1px;background:#DED6C7;margin:4px 0 13px}
#t4 .nota .val{display:flex;align-items:baseline;gap:12px}
#t4 .nota .de{text-decoration:line-through;color:#9A9083;font-size:20px}
#t4 .nota .por{font-size:34px;font-weight:700;line-height:1}
#t4 .nota .db{position:absolute;right:20px;bottom:16px;font-family:var(--serif);font-size:14px;letter-spacing:.3em;color:#B0A695}
#t4 .frasco{position:absolute;right:56px;bottom:168px;width:290px}
#t4 .frasco img{width:100%;filter:drop-shadow(0 26px 34px rgba(0,0,0,.52))}
#t4 .cta{
  position:absolute;left:58px;bottom:58px;background:#14120F;color:#F4F1EA;
  text-align:center;font-family:var(--sans);font-weight:600;font-size:24px;letter-spacing:.14em;
  padding:19px 62px;border-radius:999px;
}

/* ===== CRIATIVO 5 — vitrine ===== */
#t5{background:#0A0908;color:#F2ECE1;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;position:relative}
#t5::before{content:"";position:absolute;inset:0;background:radial-gradient(75% 46% at 50% 4%,rgba(184,149,106,.2) 0%,transparent 68%);pointer-events:none}
#t5 .marca{font-size:25px;letter-spacing:.42em;color:#C9A227;margin:52px 0 40px;position:relative}
#t5 .fila{display:flex;justify-content:center;align-items:flex-end;gap:30px;width:100%;padding:0 56px;position:relative}
#t5 .fila .it{flex:1;max-width:250px}
#t5 .fila .it img{width:100%;height:340px;object-fit:contain;filter:drop-shadow(0 16px 26px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(201,162,39,.14))}
#t5 .fila .it span{display:block;font-family:var(--sans);font-size:14px;letter-spacing:.2em;color:#B79355;margin-top:18px;text-transform:uppercase}
#t5 h2{font-size:70px;line-height:1.12;margin:52px 0 20px;font-weight:600;font-style:italic;max-width:17ch;position:relative}
#t5 h2 em{color:#C9A227;font-style:italic}
#t5 .sub{font-family:var(--sans);font-size:21px;color:#9D9487;line-height:1.55;max-width:46ch;padding:0 40px;position:relative}
#t5 .sub b{display:block;color:#F2ECE1;font-weight:600;margin-top:9px;font-size:22px}
#t5 .fundo{display:flex;justify-content:center;align-items:flex-end;margin-top:auto;width:100%;position:relative}
#t5 .fundo img{width:168px;height:270px;object-fit:contain;margin:0 -16px;filter:drop-shadow(0 -6px 22px rgba(0,0,0,.9))}
#t5 .fundo img:nth-child(even){margin-bottom:-26px}
#t5 .selo{
  position:absolute;right:52px;bottom:196px;width:212px;height:212px;
  background:linear-gradient(145deg,#E3C25C 0%,#C9A227 46%,#A5811A 100%);
  clip-path:polygon(50.0% 0.0%, 55.8% 9.9%, 64.1% 2.0%, 66.8% 13.2%, 77.0% 7.9%, 76.5% 19.4%, 87.8% 17.3%, 84.1% 28.1%, 95.5% 29.2%, 88.9% 38.6%, 99.5% 42.9%, 90.5% 50.0%, 99.5% 57.1%, 88.9% 61.4%, 95.5% 70.8%, 84.1% 71.9%, 87.8% 82.7%, 76.5% 80.6%, 77.0% 92.1%, 66.8% 86.8%, 64.1% 98.0%, 55.8% 90.1%, 50.0% 100.0%, 44.2% 90.1%, 35.9% 98.0%, 33.2% 86.8%, 23.0% 92.1%, 23.5% 80.6%, 12.2% 82.7%, 15.9% 71.9%, 4.5% 70.8%, 11.1% 61.4%, 0.5% 57.1%, 9.5% 50.0%, 0.5% 42.9%, 11.1% 38.6%, 4.5% 29.2%, 15.9% 28.1%, 12.2% 17.3%, 23.5% 19.4%, 23.0% 7.9%, 33.2% 13.2%, 35.9% 2.0%, 44.2% 9.9%);
  color:#241B08;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--sans);transform:rotate(-9deg);z-index:3;
}

/* Fotos oficiais ficam no repositório, na pasta assets/frascos/<slug>.png e
   assets/logo-escura.png / assets/logo-clara.png. Assim toda a equipe abre o
   site já com tudo no lugar. O que for enviado pelo navegador sobrescreve. */
const REPO_FRASCO = slug => `assets/frascos/${slug}.png`;
const REPO_LOGO   = {escura:'assets/logo-escura.png', clara:'assets/logo-clara.png'};
const drive = id => id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1200` : '';

const REPO_OK = {};   // preenchido ao abrir: quais frascos existem na pasta assets

async function sondarRepo(){
  const testa = url => new Promise(res=>{ const i=new Image(); i.onload=()=>res(true); i.onerror=()=>res(false); i.src=url; });
  await Promise.all(PERFUMES.map(async p=>{ REPO_OK[p.s]=await testa(REPO_FRASCO(p.s)); }));
  for(const k of ['escura','clara']){ if(!LOGO[k] && await testa(REPO_LOGO[k])) LOGO[k]=REPO_LOGO[k]; }
}

function ligarBinds(){
  $$('[data-bind]').forEach(el=>{
    el.oninput=()=>{
      const [a,b]=el.dataset.bind.split('.');
      const v=(b==='headIdx'||el.type==='range')?parseInt(el.value,10):el.value;
      if(b) D[a][b]=v; else D[a]=v;
      if(b==='headIdx') montarEspec();
      pintar();salvar();
      clearTimeout(render._c); render._c=setTimeout(mostrarConferencia,320);
    };
    if(el.tagName==='SELECT') el.onchange=el.oninput;
  });
  const enc=$('#c2enc'); if(enc) enc.onchange=()=>{D.t2.encenacao=enc.checked;pintar();salvar();};
  const fr6=$('#c6fr'); if(fr6) fr6.onchange=()=>{D.t6.frasco=fr6.checked;pintar();salvar();};
  const fr7=$('#c7fr'); if(fr7) fr7.onchange=()=>{D.t7.frasco=fr7.checked;pintar();salvar();};
  lerArquivo('#btnBg7','#fBg7',d=>{D.bg7=d;pintar();toast('Imagem aplicada');});
  lerArquivo('#btnAvatar','#fAvatar',d=>{D.avatarCustom=d;pintar();});
  lerArquivo('#btnBg4','#fBg4',d=>{D.bg4=d;pintar();toast('Fundo aplicado');});
  lerArquivo('#btnBg6','#fBg6',d=>{D.bg6=d;pintar();toast('Fundo aplicado');});
  const g4=$('#btnGer4'); if(g4) g4.onclick=()=>{G.cena='banheiro';G.produto=true;G.pessoa='maos';G.clima='caseiro';modalGerador();};
  const g6=$('#btnGer6'); if(g6) g6.onclick=()=>{G.cena='bolsa';G.produto=true;G.pessoa='nenhuma';G.clima='caseiro';modalGerador();};
  [['#btnUp4',4],['#btnUp6',6]].forEach(([sel,n])=>{
    const b=$(sel); if(!b)return;
    b.onclick=async()=>{
      b.disabled=true; b.textContent='Melhorando… pode levar um minuto';
      try{
        await melhorarImagem(n===4?D.bg4:D.bg6,img=>{ if(n===4)D.bg4=img; else D.bg6=img; pintar(); });
        toast('Fundo melhorado');
      }catch(e){ toast('Falhou: '+e.message); }
      b.disabled=false; b.textContent='Melhorar a imagem';
    };
  });
  const lt=$('#btnLote'); if(lt) lt.onclick=lote3;
}
function lerArquivo(btnSel,inpSel,cb){
  const b=$(btnSel),i=$(inpSel); if(!b||!i)return;
  b.onclick=()=>i.click();
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);};
}

function aplicarLogo(){
  // fundo claro usa a versão escura da logo, e vice-versa
  const claros=['t1','t2','t3'], escuros=['t4','t5','t6','t7'];
  $$('.dbLogo').forEach(el=>{
    const sec=el.closest('.tpl');
    const id=sec?sec.id:'';
    const usa = escuros.includes(id) ? (LOGO.clara||LOGO.escura) : (LOGO.escura||LOGO.clara);
    const precisaInverter = escuros.includes(id) ? !LOGO.clara : !LOGO.escura;
    if(usa){
      el.innerHTML=`<img src="${usa}" alt="DeoBeauty" style="height:1.15em;width:auto;display:block;${precisaInverter&&usa?'filter:invert(1) brightness(1.9);':''}">`;
      el.style.letterSpacing='0';
    } else {
      el.textContent='DEOBEAUTY';
      el.style.letterSpacing='';

  });
}

function posicionarFrasco(sel,st){
  const el=$(sel); if(!el||st.fx===undefined) return;
  el.style.left=st.fx+'%'; el.style.top=st.fy+'%'; el.style.width=st.fs+'%';
  el.style.right='auto'; el.style.bottom='auto';
  el.style.transform='translate(-50%,-50%)';
}

    im.classList.remove('falhou');

/* ==================== CONFERÊNCIA ==================== */
const SAFE_PX={f916:{topo:250,base:420},f45:{topo:0,base:150},f11:{topo:0,base:130}};

function conferirPeca(){
  const avisos=[];
  const cv=$('#canvas'), r0=cv.getBoundingClientRect();
  const escala=r0.width/1080;                 // o canvas está reduzido na tela
  const alto=cv.offsetHeight;
  const z=SAFE_PX[D.formato]||SAFE_PX.f45;
  const sec=$('.tpl.on'); if(!sec) return avisos;

  // 1. texto invadindo a área coberta pelo app
  const textos=[...sec.querySelectorAll('h2,.cta,.kick,.lead,.sub,.li,.pre,.selo,.bal,.nota,.rot,.tag,.legal,.btn6,.lbl')]
    .filter(el=>el.offsetParent!==null && el.textContent.trim());
  let invadeTopo=0, invadeBase=0;
  textos.forEach(el=>{
    const r=el.getBoundingClientRect();
    const top=(r.top-r0.top)/escala, bot=(r.bottom-r0.top)/escala;
    if(z.topo && top<z.topo) invadeTopo++;
    if(bot>alto-z.base) invadeBase++;
  });
  if(invadeTopo) avisos.push({n:'alerta',t:`${invadeTopo} elemento(s) de texto no topo, onde o app cobre (${z.topo}px)`});
  if(invadeBase) avisos.push({n:'alerta',t:`${invadeBase} elemento(s) de texto embaixo, onde ficam os botões (${z.base}px)`});

  // 2. regras da marca e do CONAR
  const tudo=vars([D.t1.head,D.t3.lead,D.t5.head,D.t5.sub,D.t6.head,D.t6.sub,D.t4.head,D.t2.msgs].join(' ')).toLowerCase();
  if(/\b(o melhor|a melhor|n[úu]mero 1|o mais vendido|l[íi]der)\b/.test(tudo)) avisos.push({n:'conar',t:'superlativo sem prova ("o melhor", "líder") — o CONAR exige comprovação'});
  if(/\b(igual ao|id[êe]ntico|mesma f[óo]rmula|c[óo]pia)\b/.test(tudo)) avisos.push({n:'conar',t:'promessa de identidade com marca alheia — evite "igual ao", "mesma fórmula"'});
  if(/\b(cliente|depoimento|comprei e|recomendo)\b/.test(tudo) && D.tpl!==2) avisos.push({n:'marca',t:'parece depoimento de cliente — a marca não usa prova social'});
  if(D.tpl===2&&!D.t2.encenacao) avisos.push({n:'marca',t:'conversa sem o selo de encenação — é depoimento fabricado'});
  if(!D.cta.trim()) avisos.push({n:'alerta',t:'peça sem CTA'});
  const semFoto=!fotoDe(perf())&&!D.fotoCustom;
  if(semFoto&&[1,3,5].includes(D.tpl)) avisos.push({n:'alerta',t:'sem foto do frasco — a peça vai sair com espaço vazio'});
  if(!LOGO.escura&&!LOGO.clara) avisos.push({n:'dica',t:'logo ainda em texto — envie os arquivos da logo em Colar briefing'});
  return avisos;
}

function mostrarConferencia(){
  const a=conferirPeca();

async function gerarIA(n){
  const url=getWorker();

  const btn=$('#btnIA'+n); btn.disabled=true; btn.textContent='Gerando…';
  try{

      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:(n===4?D.t4.prompt:D.t6.prompt),aspect:D.formato==='f916'?'vertical_9_16':'social_story_9_16'})
    });
    if(!r.ok) throw new Error('o Worker respondeu '+r.status);
    const j=await r.json();
    const img = j.image ? (j.image.startsWith('data:')?j.image:'data:image/jpeg;base64,'+j.image) : j.url;
    if(!img) throw new Error('a resposta não trouxe imagem');
    if(n===4) D.bg4=img; else D.bg6=img;

function cors(req) {

    "Access-Control-Allow-Headers": "Content-Type",

});

};

export default {
  async fetch(req, env) {
    CORS = cors(req);
    if (req.method === "OPTIONS") return new Response(null, { headers: CORS });
    if (req.method !== "POST") return json({ erro: "use POST" }, 405);

    const origem = req.headers.get("Origin") || "";
    if (origem && !PERMITIDOS.includes(origem)) return json({ erro: "origem não autorizada" }, 403);

    const body = await req.json();
    const acao = body.acao || "gerar";
    const fmt  = body.formato || "f45";

    // ---------- quais motores estão ligados ----------
    if (acao === "motores") {
      return json({
        freepik:  !!env.FREEPIK_KEY,
        seedream: !!env.FREEPIK_KEY,
        google:   !!env.GOOGLE_KEY,
        openai:   !!env.OPENAI_KEY,
        claude:   !!env.ANTHROPIC_KEY
      });
    }

    // ---------- gerar imagem ----------
    if (acao === "gerar") {
      const motor = body.motor || "freepik";

      // --- Nano Banana 2 (Google) ---
      if (motor === "google" || motor === "nano") {
        if (!env.GOOGLE_KEY) return json({ erro: "motor do Google não configurado" }, 400);
        const url = "https://generativelanguage.googleapis.com/v1beta/models/"
          + MODELO_GOOGLE + ":generateContent?key=" + env.GOOGLE_KEY;
        const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: body.prompt }] }],
              generationConfig: {
                responseModalities: ["IMAGE"],
                imageConfig: { aspectRatio: TAM.google[fmt] }
              }
            })
        });
        const d = await r.json();
        if (!r.ok) return json({ erro: d }, r.status);
        const parte = (d?.candidates?.[0]?.content?.parts || [])
          .find(x => x.inlineData || x.inline_data);
        const b64 = parte?.inlineData?.data || parte?.inline_data?.data || null;
        return b64 ? json({ image: b64 }) : json({ erro: "o modelo não devolveu imagem" }, 502);
      }

      // --- GPT Image (OpenAI) ---
      if (motor === "openai" || motor === "gpt") {
        if (!env.OPENAI_KEY) return json({ erro: "motor da OpenAI não configurado" }, 400);
        const r = await fetch("https://api.openai.com/v1/images/generations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + env.OPENAI_KEY
          },
          body: JSON.stringify({
            model: MODELO_OPENAI,
            prompt: body.prompt,
            size: TAM.openai[fmt],
            n: 1
          })
        });
        const d = await r.json();
        if (!r.ok) return json({ erro: d }, r.status);
        return json({ image: d?.data?.[0]?.b64_json || d?.data?.[0]?.url || null });
      }

      // --- Freepik / Seedream ---
      if (!env.FREEPIK_KEY) return json({ erro: "motor da Freepik não configurado" }, 400);
      const r = await fetch("https://api.freepik.com/v1/ai/text-to-image", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-freepik-api-key": env.FREEPIK_KEY },
        body: JSON.stringify({
          prompt: body.prompt,
          num_images: 1,
          image: { size: TAM.freepik[fmt] }
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ image: d?.data?.[0]?.base64 || d?.data?.[0]?.url || null });
    }

    // ---------- editar imagem (Freepik) ----------
    // acao: "editar" | body.tipo: "fundo" (remover) | "ampliar" (Magnific) | "expandir"
    if (acao === "editar") {
      if (!env.FREEPIK_KEY) return json({ erro: "motor da Freepik não configurado" }, 400);

      const ROTAS = {
        fundo:    "https://api.freepik.com/v1/ai/beta/remove-background",
        ampliar:  "https://api.freepik.com/v1/ai/image-upscaler",
        expandir: "https://api.freepik.com/v1/ai/image-expand"
      };
      const rota = ROTAS[body.tipo || "fundo"];
      if (!rota) return json({ erro: "tipo de edição desconhecido" }, 400);

      const corpo = { image: body.image };
      if (body.tipo === "ampliar") corpo.scale_factor = body.escala || "2x";
      if (body.tipo === "expandir") corpo.image_size = TAM.freepik[fmt];

      const r = await fetch(rota, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-freepik-api-key": env.FREEPIK_KEY },
        body: JSON.stringify(corpo)
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);

      // alguns desses respondem em duas etapas: devolvem um id e ficam prontos depois
      const id = d?.data?.task_id || d?.task_id;
      const pronta = d?.data?.generated?.[0] || d?.data?.base64 || d?.data?.url || null;
      if (pronta) return json({ image: pronta });
      if (id) return json({ tarefa: id, rota: body.tipo });
      return json({ erro: "o serviço não devolveu imagem" }, 502);
    }

    // ---------- consultar tarefa ----------
    if (acao === "tarefa") {
      const ROTAS = {
        fundo:    "https://api.freepik.com/v1/ai/beta/remove-background/",
        ampliar:  "https://api.freepik.com/v1/ai/image-upscaler/",
        expandir: "https://api.freepik.com/v1/ai/image-expand/"
      };
      const r = await fetch((ROTAS[body.rota] || ROTAS.ampliar) + body.tarefa, {
        headers: { "x-freepik-api-key": env.FREEPIK_KEY }
      });
      const d = await r.json();
      return json({
        status: d?.data?.status || "desconhecido",
        image: d?.data?.generated?.[0] || d?.data?.base64 || d?.data?.url || null
      });
    }

    // ---------- direção criativa (Claude pensa a peça e escreve os prompts) ----------
    if (acao === "dirigir") {
      if (!env.ANTHROPIC_KEY) return json({ erro: "direção criativa não configurada" }, 400);
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": env.ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 2500,
          system: body.sistema,
          messages: [{ role: "user", content: body.pedido }]
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ texto: (d.content || []).filter(c => c.type === "text").map(c => c.text).join("\n") });
    }

    // ---------- entender briefing em texto livre (Claude) ----------
    if (acao === "entender") {
      if (!env.ANTHROPIC_KEY) return json({ erro: "leitura por IA não configurada" }, 400);
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": env.ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          messages: [{ role: "user", content: body.instrucao + "\n\n=== TEXTO RECEBIDO ===\n" + body.texto }]
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ texto: (d.content || []).filter(c => c.type === "text").map(c => c.text).join("\n") });
    }

    // ---------- ler referência (Claude) ----------
    if (acao === "ler") {
      if (!env.ANTHROPIC_KEY) return json({ erro: "leitura de referência não configurada" }, 400);
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": env.ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1200,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: body.tipo || "image/png", data: body.image } },
              { type: "text", text: body.instrucao }
            ]
          }]
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ texto: (d.content || []).filter(c => c.type === "text").map(c => c.text).join("\n") });
    }

    return json({ erro: "ação desconhecida" }, 400);
  }
};</pre>

/* ==================== CHAMADAS AO WORKER ==================== */
async function worker(corpo){
  const url=getWorker();
  if(!url) throw new Error('o recurso de imagem ainda não está ligado nesta instalação');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});
  const j=await r.json();
  if(!r.ok||j.erro) throw new Error(typeof j.erro==='string'?j.erro:'o motor recusou a chamada');
  return j;
}
const soBase64=d=>String(d).replace(/^data:[^;]+;base64,/,'');

async function editarImagem(dataUrl,tipo,aoTerminar){
  let j=await worker({acao:'editar',tipo,image:soBase64(dataUrl),formato:D.formato});
  if(j.tarefa){
    for(let i=0;i<20;i++){
      await new Promise(r=>setTimeout(r,3000));
      const t=await worker({acao:'tarefa',tarefa:j.tarefa,rota:j.rota||tipo});
      if(t.image){ j={image:t.image}; break; }
      if(t.status==='FAILED') throw new Error('o serviço não conseguiu processar');
    }
  }
  if(!j.image) throw new Error('demorou demais, tente de novo');
  const img=(j.image.startsWith('http')||j.image.startsWith('data:'))?j.image:'data:image/png;base64,'+j.image;
  await aoTerminar(img);
  return img;
}
const melhorarImagem=(d,cb)=>editarImagem(d,'ampliar',cb);

/* ==================== BIBLIOTECA DE FRASCOS (IndexedDB) ==================== */
const LIB={};
const LOGO={clara:'',escura:''};   // clara = para fundo escuro · escura = para fundo claro
let db=null;
function abrirDB(){
  return new Promise(res=>{
    const r=indexedDB.open('deobeauty_frascos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img');
    r.onsuccess=()=>{db=r.result;res(db);};
    r.onerror=()=>res(null);
  });
}
function libSalvar(slug,dataUrl){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const tx=db.transaction('img','readwrite');
    tx.objectStore('img').put(dataUrl,slug);
    tx.oncomplete=()=>{LIB[slug]=dataUrl;res();};
    tx.onerror=()=>res();
  });
}
function libApagar(slug){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const tx=db.transaction('img','readwrite');
    tx.objectStore('img').delete(slug);
    tx.oncomplete=()=>{delete LIB[slug];res();};
    tx.onerror=()=>res();
  });
}
function logoSalvar(qual,dataUrl){ LOGO[qual]=dataUrl; return libSalvar('__logo_'+qual,dataUrl); }
function logoCarregar(){ LOGO.clara=LIB['__logo_clara']||''; LOGO.escura=LIB['__logo_escura']||''; }

function libCarregar(){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const st=db.transaction('img','readonly').objectStore('img');
    const rq=st.openCursor();
    rq.onsuccess=e=>{
      const c=e.target.result;
      if(c){LIB[c.key]=c.value;c.continue();} else res();
    };
    rq.onerror=()=>res();
  });
}
function reduzir(file,largura=1200){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const fator=Math.min(1,largura/im.width);
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*fator); cv.height=Math.round(im.height*fator);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/png'));
      };
      im.onerror=()=>rej(new Error('imagem inválida'));
      im.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('falha na leitura'));
    fr.readAsDataURL(file);
  });
}
function casarSlug(nome){
  const limpo=nome.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[_\s]+/g,'-')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'');
  let achado=PERFUMES.find(p=>p.s===limpo);
  if(achado)return achado.s;
  achado=PERFUMES.find(p=>limpo.includes(p.s)||p.s.includes(limpo));
  if(achado)return achado.s;
  achado=PERFUMES.find(p=>{
    const n=p.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
    return limpo.replace(/-/g,'').includes(n);
  });
  return achado?achado.s:null;
}

/* ==================== LEITOR DE BRIEFING ==================== */
const semAcento=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const ROTULOS=[
 {k:'criativo',  re:/^criativo\b/},
 {k:'ref',       re:/^referencia\s+visual/},
 {k:'direcao',   re:/^direcionamento\s+visual/},
 {k:'kicker',    re:/^kicker/},
 {k:'cabecalho', re:/^cabecalho/},
 {k:'headline',  re:/^(opcoes\s+de\s+)?headline/},
 {k:'sub',       re:/^subheadline/},
 {k:'baloes',    re:/^baloes/},
 {k:'selo',      re:/^selo/},
 {k:'cta',       re:/^cta\b/}
];

function normalizarVars(t){
  return String(t)
    .replace(/\{\s*produto\s*\}/gi,'{PERFUME}')
    .replace(/\[\s*perf\.?\s*deobeauty\s*\]/gi,'{PERFUME}')
    .replace(/\[\s*nome\s+do\s+(perfume|produto)\s*\]/gi,'{PERFUME}')
    .replace(/\{\s*(volume\s+da\s+)?ess[êe]ncia\s*\}/gi,'{ESSENCIA}')
    .replace(/\{\s*pre[çc]o_por\s*\}/gi,'{POR}')
    .replace(/\{\s*pre[çc]o_de\s*\}/gi,'{DE}')
    .replace(/\{\s*desconto\s*\}/gi,'{OFF}')
    .replace(/\{\s*r\$\s*[\d.,]+\s*\}/gi,'{POR}')
    .replace(/\[\s*vol\.?\s*\]/gi,'{VOLUME}')
    .replace(/\[\s*pre[çc]o\s*\]/gi,'{POR}')
    .replace(/\[\s*categoria\s*\]/gi,'{CATEG}');
}

function lerBriefing(txt){
  const linhas=txt.split('\n').map(l=>l.replace(/\s+$/,''));
  const bloco={}; let atual=null;
  linhas.forEach(l=>{
    const nu=semAcento(l.trim().replace(/[:：]\s*$/,''));
    const achado=ROTULOS.find(r=>r.re.test(nu));
    if(achado && nu.length<64){
      atual=achado.k;
      bloco[atual]=bloco[atual]||[];
      const resto=l.split(/[:：]/).slice(1).join(':').trim();
      if(resto) bloco[atual].push(resto);
      if(achado.k==='criativo'){
        const m=l.match(/(\d+)/); if(m) bloco.num=parseInt(m[1],10);
      }
      return;
    }
    if(atual && l.trim()) bloco[atual].push(l.trim());
  });
  return bloco;
}

function aplicarBriefing(txt){
  const b=lerBriefing(txt);
  const pegou=[], faltou=[];
  const junta=k=>(b[k]||[]).map(normalizarVars).join(' ').trim();
  const lista=k=>(b[k]||[]).map(normalizarVars);

  if(b.num&&b.num>=1&&b.num<=6){ D.tpl=b.num; pegou.push('criativo '+b.num); }
  const hh=(b.headline||[]).map(normalizarVars).filter(l=>!/^\d+[.)]/.test(l)).join(' ').trim();
  if(hh) G.headline=hh;
  const ss=(b.sub||[]).map(normalizarVars).join(' ').trim();
  if(ss) G.sub=ss;

  // CTA — sempre respeitado
  const cta=junta('cta');
  if(cta){ D.cta=cta.replace(/\[.*?\]/g,'').trim()||cta; pegou.push('CTA'); }
  else faltou.push('CTA (mantive o atual)');

  // selo → preços
  const selo=junta('selo');
  if(selo){
    const vals=[...selo.matchAll(/r\$\s*([\d.]+,\d{2})/gi)].map(m=>m[1]);
    const off=selo.match(/(\d{1,2})\s*%/);
    if(vals.length>=2){ D.padrao={de:vals[0],por:vals[1]}; D.de=vals[0]; D.por=vals[1]; pegou.push('preços do selo'); }
    else if(vals.length===1){ D.padrao={de:D.padrao.de,por:vals[0]}; D.por=vals[0]; pegou.push('preço do selo'); }
    if(off){ D.off=off[1]+'%'; }
    if(D.tpl===5) D.t5.selo=selo.replace(/^apenas\s*/i,'').trim()||D.t5.selo;
  }

  const kick=junta('kicker'), head=lista('headline'), sub=lista('sub');

  if(D.tpl===1){
    if(kick){ D.t1.kick=kick; pegou.push('kicker'); }
    if(head.length){ D.t1.head=head.join(' '); pegou.push('headline'); }
    const pares=sub.filter(l=>l.includes('|')).map(l=>l.split('|').map(x=>x.trim()));
    if(pares.length>=2){
      D.t1.colA=pares[0][0]||D.t1.colA; D.t1.colB=pares[0][1]||D.t1.colB;
      const itens=pares.slice(1);
      const comPreco=itens.filter(l=>/r\$|\{POR\}|\{DE\}/i.test(l.join(' ')));
      const semPreco=itens.filter(l=>!/r\$|\{POR\}|\{DE\}/i.test(l.join(' ')));
      if(comPreco.length){
        D.t1.preA=(comPreco[0][0]||'').replace(/^.*?(r\$\s*[\d.,]+|\{POR\}|\{DE\}).*$/i,'$1');
        D.t1.preB=(comPreco[0][1]||'').replace(/^.*?(r\$\s*[\d.,]+|\{POR\}|\{DE\}).*$/i,'$1')||'R$ {POR}';
      }
      ['a1','a2','a3'].forEach((k,i)=>{ D.t1[k]=semPreco[i]?semPreco[i][0]:''; });
      ['b1','b2','b3'].forEach((k,i)=>{ D.t1[k]=semPreco[i]?semPreco[i][1]:''; });
      pegou.push('confronto de preços');
    } else if(sub.length) faltou.push('tabela do confronto — separe as colunas com |');
  }

  if(D.tpl===2){
    if(kick){
      const nome=kick.split('\n')[0].replace(/\[|\]/g,'').replace(/online/i,'')
        .replace(/[^\p{L}\p{N}\s'.-]/gu,'').trim();
      if(nome && !/nome da amiga/i.test(nome)){ D.t2.amiga=nome; pegou.push('nome da amiga'); }
    }
    const bal=lista('baloes').filter(l=>/\[(recebido|enviado)\]/i.test(l));
    if(bal.length){
      D.t2.msgs=bal.map(l=>{
        const env=/\[enviado\]/i.test(l);
        let t=l.replace(/\[(recebido|enviado)\]\s*/i,'').trim();
        if(/^\[?\s*foto\b/i.test(t)) t='[foto]';
        return (env?'e: ':'r: ')+t;
      }).join('\n');
      pegou.push(bal.length+' balões');
    } else faltou.push('balões — precisam vir marcados com [recebido] / [enviado]');
  }

  if(D.tpl===3){
    const cab=lista('cabecalho');
    if(cab.length>1){ D.t3.editoria=cab[cab.length-1].toUpperCase(); pegou.push('editoria'); }
    const ops=head.filter(l=>/^\d+[.)]/.test(l)).map(l=>l.replace(/^\d+[.)]\s*/,''));
    if(ops.length){ D.heads3=ops; D.t3.headIdx=0; pegou.push(ops.length+' headlines'); }
    else if(head.length){ D.heads3=[head.join(' ')]; D.t3.headIdx=0; pegou.push('headline'); }
    if(sub.length){ D.t3.lead=sub.join(' '); pegou.push('subheadline'); }
  }

  if(D.tpl===4){
    if(head.length){ D.t4.head=head.join(' ').toLowerCase(); pegou.push('headline'); }
    sub.forEach(l=>{
      const m=l.match(/^(.+?):\s*(.+)$/);
      if(!m)return;
      const rot=semAcento(m[1]);
      if(rot.includes('efeito')){ D.t4.r1t=m[1]+':'; D.t4.r1=m[2]; }
      else if(rot.includes('nao serve')||rot.includes('para quem')){ D.t4.r2t=m[1]+':'; D.t4.r2=m[2]; }
      else if(rot.includes('valor')||rot.includes('preco')){ D.t4.r3t=m[1]+':'; }
    });
    if(sub.length) pegou.push('nota de papel');
  }

  if(D.tpl===5){
    if(head.length){
      D.t5.head=head[0];
      if(head[1]) D.t5.sub=head.slice(1).join(' ')+(sub.length?' '+sub.join(' '):'');
      pegou.push('headline');
    }
    if(sub.length && !head[1]){ D.t5.sub=sub.join(' '); pegou.push('subheadline'); }
  }

  if(D.tpl===6){
    if(head.length){ D.t6.head=head.join(' '); pegou.push('headline'); }
    if(sub.length){ D.t6.sub=sub.join(' '); pegou.push('subheadline'); }
    const c=junta('cta');
    if(c){
      const partes=c.split(/\n|\[/)[0].trim();
      if(partes) D.t6.lbl=partes;
    }
  }

  return {pegou,faltou};
}

  quente:'luz quente e suave vinda de cima',
  natural:'luz natural do fim de tarde entrando de lado',
  manha:'luz da manhã difusa, sombras longas e macias',
  dura:'luz dura de estúdio com sombra marcada',
  noite:'luz baixa e quente da noite, pontos de luz desfocados ao fundo'
};
const CLIMAS={
  caseiro:'clima caseiro e espontâneo, como uma foto tirada no celular sem produção',
  aspiracional:'clima aspiracional e sofisticado, sem parecer publicitário demais',
  premium:'clima premium e escuro, com brilho controlado',
  clean:'clima clean e arejado, paleta clara'
};
const ENQUADRA=[
  {n:'plano aberto',b:'plano aberto mostrando o ambiente inteiro, câmera na altura dos olhos'},
  {n:'plano fechado',b:'plano fechado com fundo desfocado, foco raso, primeiro plano levemente fora de foco'},
  {n:'visto de cima',b:'visto ligeiramente de cima, composição diagonal'}
];
const FORMATOS_TXT={f45:'vertical 4:5',f916:'vertical 9:16',f11:'quadrado 1:1'};

const G={motor:'nano',cena:'banheiro',livre:'',luz:'quente',clima:'caseiro',produto:true,pessoa:'nenhuma',extra:'',
         headline:'',sub:''};

/* Espalha a headline e a subheadline pelos seis criativos. Cada um recebe
   no campo que faz sentido nele — o Vapor quebra em linhas, a Manchete
   entra na lista de headlines, e assim por diante. */
function aplicarTextos(){
  const h=G.headline.trim(), sb=G.sub.trim();
  if(!h&&!sb) return [];
  const feitos=[];
  if(h){
    D.t1.head=h;
    D.heads3=[h]; D.t3.headIdx=0;
    D.t4.head=h.replace(/([.!?,])\s+/g, '$1' + String.fromCharCode(10));
    D.t5.head=h;
    D.t6.head=h;
    D.t7.head=h;
    feitos.push('headline');
  }
  if(sb){
    D.t3.lead=sb;
    D.t5.sub=sb;
    D.t6.sub=sb;
    D.t7.sub=sb;
    D.t4.r1=sb;
    feitos.push('subheadline');
  }
  salvar();
  return feitos;
}

function montarPrompt(i){
  const m=MOTORES[G.motor], p=perf();
  const base=CENAS[G.cena]&&CENAS[G.cena].b?CENAS[G.cena].b:(G.extra.trim()||'uma cena de perfumaria');
  const partes=[];
  partes.push(ENQUADRA[i].b.charAt(0).toUpperCase()+ENQUADRA[i].b.slice(1)+' de '+base);
  if(G.produto) partes.push('um frasco de perfume aparecendo na cena de forma natural, sem destaque publicitário');
  if(G.pessoa==='maos') partes.push('apenas as mãos de uma mulher aparecem, sem rosto');
  if(G.pessoa==='mulher') partes.push('uma mulher adulta na cena, de costas ou parcialmente fora de quadro, sem rosto em destaque');
  partes.push(LUZES[G.luz]);
  partes.push(CLIMAS[G.clima]);
  if(G.extra.trim()&&CENAS[G.cena]&&CENAS[G.cena].b) partes.push(G.extra.trim());
  let txt=partes.join(', ')+'.';
  if(G.headline.trim()) txt+=` A cena precisa transmitir esta ideia, sem escrevê-la: "${G.headline.trim()}".`;
  return txt+' '+m.cauda(FORMATOS_TXT[D.formato]||'vertical 4:5');
}

const INSTRUCAO = `Você está analisando a imagem de um anúncio de referência para uma marca de perfumaria brasileira.
Responda SOMENTE com um objeto JSON, sem markdown, sem crases, sem texto antes ou depois.

{
  "criativo": número de 1 a 6 ou null,
  "kicker": texto pequeno acima da headline, ou "",
  "headline": a frase principal, ou "",
  "subheadline": o texto de apoio, ou "",
  "cta": o texto do botão, ou "",
  "selo": o texto do selo de desconto, ou "",
  "precoDe": apenas o número do preço antigo no formato 359,99, ou "",
  "precoPor": apenas o número do preço novo no formato 99,90, ou "",
  "cena": se a peça tiver uma foto de cenário ao fundo, descreva essa cena em uma frase em português, pronta para ser usada como prompt de geração de imagem; se for fundo liso ou só produto, deixe ""
  "observacoes": uma frase curta sobre o que mais chama atenção no layout
}

Para o campo "criativo", escolha o que mais se parece:
1 = comparação de preço com o produto no centro e duas colunas de valores
2 = print de conversa de celular
3 = layout de notícia, com barra escura no topo e manchete
4 = foto de banheiro com frase escrita no vidro embaçado
5 = vários frascos enfileirados em fundo escuro
6 = foto espontânea estilo stories com texto por cima

Transcreva os textos exatamente como aparecem, mantendo acentuação. Se não houver, use string vazia.`;

async function analisarReferencia(dataUrl,tipo){
  const j=await worker({acao:'ler',image:soBase64(dataUrl),tipo,instrucao:INSTRUCAO});
  const limpo=String(j.texto||'').replace(/```json|```/g,'').trim();
  const ini=limpo.indexOf('{'), fim=limpo.lastIndexOf('}');
  if(ini<0||fim<0) throw new Error('não entendi a resposta do motor');
  return JSON.parse(limpo.slice(ini,fim+1));
}

function aplicarLeitura(r){
  const pegou=[];
  if(r.criativo>=1&&r.criativo<=6){ D.tpl=r.criativo; pegou.push('criativo '+r.criativo+' ('+NOMES[r.criativo-1]+')'); }
  if(r.cta){ D.cta=r.cta; pegou.push('CTA'); }
  if(r.precoDe){ D.de=r.precoDe; D.padrao.de=r.precoDe; pegou.push('preço de'); }
  if(r.precoPor){ D.por=r.precoPor; D.padrao.por=r.precoPor; pegou.push('preço por'); }
  if(r.precoDe&&r.precoPor){
    const a=parseFloat(r.precoDe.replace(/\./g,'').replace(',','.'));
    const b=parseFloat(r.precoPor.replace(/\./g,'').replace(',','.'));
    if(a>0&&b>0&&b<a) D.off=Math.round((1-b/a)*100)+'%';
  }
  const t=D.tpl;
  if(t===1){
    if(r.kicker){D.t1.kick=r.kicker;pegou.push('kicker');}
    if(r.headline){D.t1.head=r.headline;pegou.push('headline');}
  }
  if(t===3){
    if(r.headline){D.heads3=[r.headline];D.t3.headIdx=0;pegou.push('headline');}
    if(r.subheadline){D.t3.lead=r.subheadline;pegou.push('subheadline');}
    if(r.kicker){D.t3.editoria=r.kicker.toUpperCase();pegou.push('editoria');}
  }
  if(t===4){
    if(r.headline){D.t4.head=r.headline.replace(/\.\s+/g,'\n');pegou.push('escrita no vidro');}
    if(r.cena){D.t4.prompt=r.cena;pegou.push('prompt da cena');}
  }
  if(t===5){
    if(r.headline){D.t5.head=r.headline;pegou.push('headline');}
    if(r.subheadline){D.t5.sub=r.subheadline;pegou.push('subheadline');}
    if(r.selo){D.t5.selo=r.selo.replace(/^(só|apenas)\s*/i,'').replace(/\s*cada$/i,'').trim()||D.t5.selo;}
  }
  if(t===6){
    if(r.headline){D.t6.head=r.headline;pegou.push('headline');}
    if(r.subheadline){D.t6.sub=r.subheadline;pegou.push('subheadline');}
    if(r.cena){D.t6.prompt=r.cena;pegou.push('prompt da cena');}
  }
  if(t===2&&r.headline){ D.t2.msgs='r: '+r.headline; pegou.push('texto'); }
  return pegou;
}

const INSTRUCAO_TEXTO = `Você recebe um briefing de anúncio para a DeoBeauty, marca brasileira de perfumaria (eau de parfum, 20% de essência, R$ 99,90). O texto pode vir estruturado ou solto, como um recado.

{
  "criativo": número de 1 a 6 ou null,

  "kicker": "", "headline": "", "subheadline": "", "cta": "",
  "precoDe": "359,99" ou "", "precoPor": "99,90" ou "",
  "baloes": [ {"de":"amiga"|"marca","texto":"..."} ] ou [],
  "cena": uma frase em português descrevendo o cenário da foto, se o briefing pedir cena, ou "",

Criativos: 1 = comparação de preço com importado · 2 = print de conversa · 3 = notícia/manchete · 4 = frase escrita no vidro embaçado · 5 = vários frascos em fundo escuro · 6 = stories espontâneo.
Se o texto não disser qual criativo, escolha pelo conteúdo: menção a importado ou "R$ 800" → 1; diálogo → 2; tom de notícia → 3; banheiro/espelho/vidro → 4; "linha", "coleção", vários perfumes → 5; tom pessoal de stories → 6.
Transcreva as frases exatamente como estão. Placeholders como {PRODUTO}, [Nome do perfume], {PREÇO_POR} devem ser mantidos como vieram. Não invente preço nem frase que não esteja no texto.`;

async function entenderPorIA(txt){
  const j=await worker({acao:'entender',texto:txt,instrucao:INSTRUCAO_TEXTO});
  const limpo=String(j.texto||'').replace(/```json|```/g,'').trim();
  const a=limpo.indexOf('{'), b=limpo.lastIndexOf('}');
  if(a<0||b<0) throw new Error('resposta ilegível');
  return JSON.parse(limpo.slice(a,b+1));

function aplicarEntendimento(r){
  const pegou=[];
  if(r.perfume){
    const alvo=semAcento(r.perfume);
    const ach=PERFUMES.find(p=>alvo.includes(semAcento(p.n))||semAcento(p.n).includes(alvo));
    if(ach){ D.perfume=ach.s; aplicarPreco(ach.s); pegou.push('perfume: '+ach.n); }
  }
  if(r.criativo>=1&&r.criativo<=7){ D.tpl=r.criativo; pegou.push(NOMES[r.criativo-1]); }
  if(r.cta){ D.cta=r.cta; pegou.push('CTA'); }
  if(r.precoDe){ D.de=r.precoDe; D.padrao.de=r.precoDe; }
  if(r.precoPor){ D.por=r.precoPor; D.padrao.por=r.precoPor; }
  if(r.precoDe&&r.precoPor){
    const a=parseFloat(r.precoDe.replace(/\./g,'').replace(',','.')), b=parseFloat(r.precoPor.replace(/\./g,'').replace(',','.'));
    if(a>0&&b>0&&b<a){ D.off=Math.round((1-b/a)*100)+'%'; pegou.push('preços'); }
  }
  if(r.headline){ G.headline=normalizarVars(r.headline); }
  if(r.subheadline){ G.sub=normalizarVars(r.subheadline); }
  if(r.kicker&&D.tpl===1) D.t1.kick=r.kicker;
  if(r.kicker&&D.tpl===3) D.t3.editoria=r.kicker.toUpperCase();
  if(Array.isArray(r.baloes)&&r.baloes.length){
    D.t2.msgs=r.baloes.map(b=>(b.de==='marca'?'e: ':'r: ')+normalizarVars(b.texto||'')).join('\n');
    pegou.push(r.baloes.length+' balões');
  }
  if(r.amiga&&!/nome da amiga/i.test(r.amiga)) D.t2.amiga=r.amiga;
  if(r.cena){ if(D.tpl===4) D.t4.prompt=r.cena; if(D.tpl===6) D.t6.prompt=r.cena; G.extra=r.cena; G.cena='livre'; pegou.push('cena'); }
  const f=aplicarTextos(); pegou.push(...f);
  return {pegou,duvidas:r.duvidas||''};
}

/* ==================== CRÍTICA E REFINO ==================== */
const INSTRUCAO_CRITICA=`Você é o diretor criativo sênior da DeoBeauty avaliando uma imagem recém-gerada para um anúncio. Seja duro como quem vai assinar a peça. Verifique: parece IA (brilho plástico, simetria morta, pele de cera, frasco flutuando sem contato ou sombra)? O frasco condiz com a referência? A tampa está certa (aberta só se estiver borrifando)? A luz tem origem? O ponto focal é um só? Há texto errado ou indesejado? A composição deixa espaço para o texto do layout?
Responda SOMENTE com JSON, sem markdown:
{
  "nota": 1 a 10,
  "aprovaria": true ou false,
  "problemas": ["frase curta por problema, no máximo 5"],
  "acertos": ["o que funciona, no máximo 3"],
  "prompt_corrigido": "o prompt original reescrito para resolver os problemas, mantendo o conceito. Em inglês, começando com 'Using the attached product photo as absolute reference for the bottle (@PRODUTO)'."
}`;

async function criticar(img,promptOriginal){
  const tipo=img.startsWith('data:')?img.slice(5,img.indexOf(';')):'image/png';
  const j=await worker({acao:'ler',image:soBase64(img),tipo,instrucao:INSTRUCAO_CRITICA+`\n\nPROMPT QUE GEROU ESTA IMAGEM:\n${promptOriginal}`});
  const limpo=String(j.texto||'').replace(/```json|```/g,'').trim();
  const a=limpo.indexOf('{'), b=limpo.lastIndexOf('}');
  if(a<0||b<0) throw new Error('crítica ilegível');
  return JSON.parse(limpo.slice(a,b+1));
}

/* ==================== DIRETOR CRIATIVO ==================== */
/* Este é o cérebro. Ele foi escrito com as regras que a Larissa já usa nos
   fluxos dela: o frasco é autoridade, texto integrado à cena, CTA curto,
   referência é qualidade de render e não cópia, lifestyle sem prova social. */
const SISTEMA_DIRETOR = `Você é o diretor criativo sênior da DeoBeauty, perfumaria brasileira. Você pensa como um designer com quinze anos de tráfego pago em beleza: cada peça tem UM conceito, UM ponto focal e UMA leitura em dois segundos. Você detesta imagem que parece feita por IA — brilho excessivo, simetria perfeita, frasco flutuando, cena vazia de intenção.

A MARCA
- Eau de parfum, 20% de essência, padrão internacional feito no Brasil. Preço de linha R$ 99,90.
- Paleta sóbria: marfim/off-white/bege como base (70%), preto e marrom estruturais (20%), dourado e rosa claro como acento (10%). O rosa é tempero, nunca protagonista.
- Personalidade: elegante, sofisticada, feminina, acolhedora, premium sem ser vulgar.
- Tipografia: Recline nos títulos e detalhes, Poppins em textos longos.
- Comunica valor em três pilares: mostrar as notas; provar performance ("deixa rastro, dura o dia"); tornar o perfume a marca da pessoa ("todo mundo sabe que sou eu porque uso o Valen").
- NUNCA usa depoimento de cliente, repost, prova social ou bastidores. Prefere lifestyle aspiracional: o frasco em cenas de vida.

REGRAS DE PRODUÇÃO (não negociáveis)
1. O frasco real vai como imagem de referência (@PRODUTO). Formato, cor, rótulo e tampa são autoridade absoluta — proibido inventar ou alterar. Se a cena mostra aplicação ou borrifo, o frasco está ABERTO, tampa fora; se só está segurando ou exposto, FECHADO.
2. Texto dentro da imagem só quando for CTA curto (máximo duas linhas, sem emoji) e sempre como objeto 3D integrado à cena: gravado em pedra, letreiro de metal, relevo em vidro, neon, letras de acrílico — nunca sobreposição plana. O texto obedece à luz e às sombras da cena. Textos longos, preços e comparações ficam FORA da imagem, na camada de layout.
3. Composição cinematográfica: primeiro plano com bokeh, plano médio nítido com o produto, fundo com profundidade. Regra dos terços ou centralização deliberada — nunca "meio que centralizado".
4. Luz com origem clara e motivo (janela, abajur, fim de tarde). Nada de luz uniforme de estúdio a menos que o briefing peça foto de e-commerce.
5. Referências visuais de outras marcas servem apenas para qualidade de render e tratamento de texto — jamais copiar fundo, logo, cor ou identidade delas.
6. Sempre três variações reais, que mudem conceito ou enquadramento — não a mesma cena com palavra trocada.
7. Pessoas: adultas, sem rosto em destaque a menos que o briefing traga @REF de identidade. Mãos e gestos contam mais que expressão.

COMO VOCÊ ENTREGA
Responda SOMENTE com JSON, sem markdown:
{
  "conceito": "uma frase: a ideia por trás da peça",
  "porque": "uma frase: por que essa ideia vende para público frio de tráfego",
  "ponto_focal": "o que o olho vê primeiro",
  "texto_na_imagem": "" ou o CTA curto que vai integrado em 3D (máximo 2 linhas),
  "texto_fora": { "headline": "...", "subheadline": "...", "cta": "..." },
  "variacoes": [
    { "nome": "3 palavras", "prompt": "prompt completo em inglês, 120 a 200 palavras, descrevendo cena, câmera, lente, luz, materiais, posição exata do @PRODUTO, tratamento do texto 3D se houver, e terminando com as restrições: no extra text, no logos, no watermark, natural skin, no plastic look" },
    { ... }, { ... }
  ],
  "formato": "4:5" ou "9:16",
  "alerta": "" ou o que no briefing conflita com a marca ou com o CONAR
}
Os prompts começam sempre com "Using the attached product photo as absolute reference for the bottle (@PRODUTO)". Escreva o prompt como quem dirige um fotógrafo, não como quem lista tags.`;

const APROVADOS='db_aprovados';
const lerAprovados=()=>{try{return JSON.parse(localStorage.getItem(APROVADOS)||'[]');}catch(e){return [];}};
function aprovar(item){
  const a=lerAprovados();
  a.unshift({quando:new Date().toISOString(),conceito:item.conceito||'',prompt:item.prompt,perfume:item.perfume});
  try{localStorage.setItem(APROVADOS,JSON.stringify(a.slice(0,30)));}catch(e){}
  toast('Aprovada — entra como referência nas próximas direções');
}

async function dirigir(briefing){
  const p=perf();
  const aprovados=lerAprovados().slice(0,5);
  const memoria=aprovados.length
    ? `\n\nPEÇAS QUE A LARISSA APROVOU RECENTEMENTE (calibre o gosto por elas, sem copiar):\n`+aprovados.map((a,i)=>`${i+1}. ${a.conceito} — ${a.prompt.slice(0,220)}…`).join('\n')
    : '';
  const pedido=`BRIEFING RECEBIDO:\n${briefing}`+guiaDeGosto()+`\n\nPERFUME: ${p.n}${p.i?' (inspirado em '+p.i+')':''} · ${p.f||''} · ${D.volume} · ${D.essencia} de essência · de R$ ${D.de} por R$ ${D.por}.\nCRIATIVO ESCOLHIDO: ${D.tpl} (${NOMES[D.tpl-1]}). Formato de saída da campanha: feed 4:5 e stories 9:16.${memoria}\n\nPense como diretor, depois escreva.`;
  const j=await worker({acao:'dirigir',sistema:SISTEMA_DIRETOR,pedido});
  const limpo=String(j.texto||'').replace(/```json|```/g,'').trim();
  const a=limpo.indexOf('{'), b=limpo.lastIndexOf('}');
  if(a<0||b<0) throw new Error('o diretor não respondeu em formato legível');
  return JSON.parse(limpo.slice(a,b+1));
}

async function refsDoProduto(){
  // frasco real como referência de imagem; estilo, se houver
  const refs=[];
  const foto=D.fotoCustom||fotoDe(perf());
  const paraB64=async src=>{
    if(!src) return null;
    if(src.startsWith('data:')) return {tipo:src.slice(5,src.indexOf(';')),data:soBase64(src)};
    try{ const r=await fetch(src); const bl=await r.blob();
      const d=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(bl);});
      return {tipo:bl.type||'image/png',data:soBase64(d)}; }catch(e){ return null; }
  };
  const f=await paraB64(foto); if(f) refs.push(f);
  const e=await paraB64(G.estilo); if(e) refs.push(e);
  return refs;
}

async function produzirVar(i,promptForcado){
  const v=DIRECAO.variacoes[i], alvo=$('#varImg'+i);
  const ligados=await checarMotores();
  if(!ligados[MOTORES[G.motor].chave]){ toast(`${MOTORES[G.motor].nome} não está ligado`); return; }
  const prompt=promptForcado||v.prompt;
  alvo.innerHTML='<div class="carregando"><div class="girando"></div>produzindo com o frasco real como referência</div>';
  try{
    const refs=MOTOR_API[G.motor]==='google'?await refsDoProduto():[];
    const j=await worker({acao:'gerar',motor:MOTOR_API[G.motor],prompt,formato:D.formato,refs});
    const img=j.image?((j.image.startsWith('data:')||j.image.startsWith('http'))?j.image:'data:image/png;base64,'+j.image):null;
    if(!img) throw new Error('não veio imagem');
    v.img=img; v.promptUsado=prompt;
    mostrarResultado(i);
    // o diretor olha o que produziu
    if(ligados.claude && D.autoCritica!==false) avaliarVar(i);
  }catch(e){ alvo.innerHTML=`<div class="carregando" style="color:#D89A5C">${esc(e.message)}</div>`; }
}

function mostrarResultado(i){
  const v=DIRECAO.variacoes[i], alvo=$('#varImg'+i);
  alvo.innerHTML=`<img src="${v.img}">
    <div id="crit${i}" class="critica"></div>
    <div class="acoes" style="margin-top:8px">
      <button class="chipG on" data-fechar="${i}">Fechar a peça</button>
      <button class="chipG" data-ap="${i}">✓ aprovar</button>
      <button class="chipG" data-aval="${i}">avaliar</button>
      <a class="chipG" href="${v.img}" download="DB_dir_${perf().s}_v${i+1}.png">baixar</a>
    </div>`;
  $(`[data-ap="${i}"]`).onclick=()=>aprovar({conceito:DIRECAO.conceito,prompt:v.promptUsado||v.prompt,perfume:perf().n});
  $(`[data-aval="${i}"]`).onclick=()=>avaliarVar(i);
  $(`[data-fechar="${i}"]`).onclick=()=>fecharPeca(i);
}

async function avaliarVar(i){
  const v=DIRECAO.variacoes[i], box=$('#crit'+i); if(!box) return;
  box.innerHTML='<div class="carregando" style="padding:12px"><div class="girando"></div>o diretor está olhando</div>';
  try{
    const c=await criticar(v.img,v.promptUsado||v.prompt);
    v.critica=c;
    box.innerHTML=`
      <div class="critCab"><b class="${c.aprovaria?'ok':'nao'}">${c.nota}/10 · ${c.aprovaria?'aprovaria':'não aprovaria'}</b></div>
      ${(c.problemas||[]).length?`<ul>${c.problemas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${(c.acertos||[]).length?`<div class="critOk">${c.acertos.map(x=>esc(x)).join(' · ')}</div>`:''}
      ${!c.aprovaria&&c.prompt_corrigido?`<button class="chipG on" data-refazer="${i}" style="margin-top:8px">Refazer com as correções</button>`:''}`;
    const rf=$(`[data-refazer="${i}"]`);

    if(!getWorker()||!ligados.claude){ await entenderEMontar(); return; }
    try{ aplicarEntendimento(await entenderPorIA(txt)); }catch(e){ aplicarBriefing(txt); }
    salvar(); await produzir();
  };
}

async function entenderEMontar(){
  const txt=$('#colaTxt').value.trim();
  if(!txt){toast('Cole o briefing primeiro');return;}
  const b=$('#colaDirigir'), st=$('#colaStatus');
  b.disabled=true; b.textContent='Lendo…'; st.textContent='Separando as partes do briefing.';

  let r, viaIA=false;
  const ligados=await checarMotores();
  if(getWorker()&&ligados.claude){
    try{ st.textContent='Lendo com IA…'; r=aplicarEntendimento(await entenderPorIA(txt)); viaIA=true; }
    catch(e){ r=null; }
  }
  if(!r||!r.pegou.length) r=aplicarBriefing(txt);
  if(!r.pegou.length){
    st.textContent=ligados.claude
      ? 'Não consegui extrair nada desse texto.'
      : 'Não reconheci nada. Sem leitura por IA ligada, o texto precisa vir com as palavras CRIATIVO, HEADLINE, SUBHEADLINE e CTA.';
    b.disabled=false; b.textContent='Gerar'; return;
  }
  r.faltou=r.faltou||[]; if(r.duvidas) r.faltou.push(r.duvidas);

  st.textContent='Reconheci: '+r.pegou.join(', ')+'. Montando as peças…';
  salvar();
  PECAS.length=0; renderFeitas();

  const guardado={tpl:D.tpl,formato:D.formato,safe:D.safe};
  D.safe=false;
  for(const f of FORMATOS){
    D.tpl=guardado.tpl; D.formato=f;
    $$('.tpl').forEach((t,k)=>t.classList.toggle('on',k+1===D.tpl));
    $('#canvas').className=f;
    pintar(); await esperarImagens();
    try{
      const avisos=conferirPeca().filter(x=>x.n!=='dica');
      const cv=await capturar(1);
      PECAS.push({nome:NOMES[D.tpl-1],fmt:rotuloFmt[f],slug:perf().s,tpl:D.tpl,img:cv.toDataURL('image/png'),avisos});
    }catch(e){ PECAS.push({nome:NOMES[D.tpl-1],fmt:rotuloFmt[f],erro:e.message}); }
    renderFeitas();
  }
  Object.assign(D,guardado); render();

  st.innerHTML=r.faltou.length
    ? 'Pronto. Não reconheci: '+esc(r.faltou.join(' · '))
    : 'Pronto. As peças estão à direita.';
  b.disabled=false; b.textContent='Gerar';
}

async function gerarTres(){
  const ligados=await checarMotores();
  const chave=MOTORES[G.motor].chave;
  if(!getWorker()||!ligados[chave]){
    toast(getWorker()?`${MOTORES[G.motor].nome} não está ligado aqui`:'Nenhum motor ligado ainda');
    return;
  }
  const b=$('#gIr'); b.disabled=true; b.textContent='Gerando…';
  const p=perf();
  const quantos=G.auto?(G.qtd||3):1;
  const novas=ENQUADRA.slice(0,quantos).map((e,i)=>({
    enq:G.auto?e.n:'seu prompt',perfume:p.n,slug:p.s,img:null,erro:null,
    prompt:G.auto?montarPrompt(i):(G.manual||montarPrompt(0))
  }));
  GERADAS.unshift(...novas); renderGaleria();
  for(const item of novas){
    try{
      const j=await worker({acao:'gerar',motor:MOTOR_API[G.motor],prompt:item.prompt,formato:D.formato});
      const img=j.image?((j.image.startsWith('data:')||j.image.startsWith('http'))?j.image:'data:image/jpeg;base64,'+j.image):null;
      if(!img) throw new Error('não veio imagem');
      item.img=img;
    }catch(e){ item.erro=e.message; }
    renderGaleria();
  }
  b.disabled=false; b.textContent='Gerar';
}

  <button class="fechar" data-x>×</button>
  <h3>Como usar</h3>
  <p>Esta ferramenta monta as artes de anúncio da DeoBeauty. Você escolhe o perfume e o tipo de criativo; o texto, o preço e a foto do frasco entram sozinhos. Nada é publicado automaticamente — você baixa a imagem e sobe no gerenciador.</p>

  <div class="grupo" style="margin-top:20px"><h2>Os dois modos</h2>
    <p style="margin:0"><b style="color:var(--creme)">Passo a passo</b> é o dia a dia: três escolhas e baixar.<br>
    <b style="color:var(--creme)">Tudo aberto</b> libera cada texto pra edição, os formatos e o ajuste fino.</p>
  </div>

  <div class="grupo"><h2>A configuração inicial</h2>
    <p style="margin:0"><b style="color:var(--creme)">Frascos</b> — arraste as fotos dos perfumes de uma vez. Ficam guardadas neste computador e entram sozinhas em cada peça. É a única coisa a fazer antes de começar.<br>
    <b style="color:var(--creme)">Preços</b> — já vem com R$ 99,90 pra linha inteira. Quando o valor mudar, troca num campo só e vale pra todos. Lançamento com preço diferente entra como exceção na mesma tela.</p>
  </div>

  <div class="grupo"><h2>Produzir em lote</h2>
    <p style="margin:0">Marca vários perfumes e vários criativos e sai um .zip com tudo pronto, já com o nome certo em cada arquivo. É o que economiza o dia inteiro. Antes de mandar um lote grande, rode um teste com 2 perfumes.</p>
  </div>

  <div class="grupo"><h2>Termos que aparecem</h2>
    <p style="margin:0"><b style="color:var(--creme)">Safezone</b> — a faixa de cima e de baixo onde o Instagram cobre a arte com os botões dele. Não coloque texto ali.<br>
    <b style="color:var(--creme)">Headline</b> — a frase grande, a que faz a pessoa parar de rolar.<br>
    <b style="color:var(--creme)">Público frio</b> — quem nunca teve contato com a marca.<br>
    <b style="color:var(--creme)">4:5, 1:1, 9:16</b> — o formato da imagem. 4:5 é o feed, 9:16 é stories e reels.</p>
  </div>

  <div class="grupo"><h2>Se der errado</h2>
    <p style="margin:0"><b style="color:var(--creme)">O frasco não aparece</b> — aquele perfume ainda não tem foto enviada. Abra Frascos e mande a imagem.<br>

    <b style="color:var(--creme)">Sumiu tudo o que eu tinha configurado</b> — os dados ficam neste navegador. Outro computador, ou limpar o histórico, começa do zero.</p>
  </div>`;
  $('#modal').classList.add('on');

$('#btnAjuda').onclick=modalAjuda;

function boasVindas(){
  try{ if(localStorage.getItem('db_visto'))return; localStorage.setItem('db_visto','1'); }catch(e){}
  modalAjuda();
}
