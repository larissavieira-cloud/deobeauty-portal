<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeoBeauty · Criativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@font-face{font-family:'Recline';src:url('assets/Recline.woff2') format('woff2'),url('assets/Recline.woff') format('woff'),url('assets/Recline.ttf') format('truetype');font-weight:400 700;font-display:swap}
:root{
  --serif:'Recline','Cormorant Garamond',Georgia,serif;
  --sans:'Poppins',system-ui,-apple-system,sans-serif;
  --dourado:#B8956A;--marrom:#6B4E3D;--preto:#141414;--creme:#F8F5EE;--marfim:#EFE8DC;--rosa:#E8C9C4;--branco:#fff;--vermelho:#B22222;
  --bg:#0F0D0C;--painel:#161311;--linha:#26201C;--linha2:#33291F;--txt:#EDE4D9;--fraco:#8F8174;--ouro:#C9A66E;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;display:grid;grid-template-columns:392px 1fr;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* ===== PAINEL (esquerda) ===== */
#painel{background:var(--painel);border-right:1px solid var(--linha);height:100vh;display:flex;flex-direction:column}
#topo{padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between}
#topo h1{margin:0;font-family:var(--serif);font-size:20px;letter-spacing:.16em;font-weight:600;color:var(--creme)}
#topo button{background:none;border:1px solid var(--linha2);color:var(--fraco);border-radius:7px;padding:5px 10px;font-size:11.5px;cursor:pointer}
#topo button:hover{border-color:var(--ouro);color:var(--creme)}
#form{flex:1;overflow-y:auto;padding:0 22px 26px}
#form::-webkit-scrollbar{width:8px} #form::-webkit-scrollbar-thumb{background:var(--linha2);border-radius:8px}
.sec{margin-bottom:18px}
.sec>h2{margin:0 0 8px;font-size:10px;letter-spacing:.2em;font-weight:600;color:var(--fraco);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.sec>h2 small{font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;color:#6A5E53}
.sel{width:100%;background:#1D1815;border:1px solid var(--linha2);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--creme);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fraco) 50%),linear-gradient(135deg,var(--fraco) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.sel:focus{outline:none;border-color:var(--ouro)}
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ref{border:1px dashed var(--linha2);border-radius:10px;height:84px;background:#1D1815;cursor:pointer;color:var(--fraco);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.14s;position:relative;overflow:hidden}
.ref:hover{border-color:var(--ouro);color:var(--creme)}
.ref.cheio{border-style:solid} .ref img{max-width:78%;max-height:52px;object-fit:contain}
.ref b{position:absolute;bottom:4px;font-size:9.5px;letter-spacing:.1em;font-weight:500;opacity:.8}
.ref.escura{background:#EFE9DE;color:#5A5048} .ref.clara{background:#0B0908}
.ref .ico{font-size:18px;opacity:.7}
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tipo{background:#1D1815;border:1px solid var(--linha2);border-radius:10px;padding:10px 6px 9px;cursor:pointer;text-align:center;transition:.14s;color:var(--fraco)}
.tipo:hover{border-color:#4A3B2E;color:var(--creme)}
.tipo.on{background:#2A1F16;border-color:var(--ouro);color:#F1DDB9}
.tipo .ic{display:block;font-size:17px;margin-bottom:5px;font-family:var(--serif)}
.tipo span{font-size:10.5px;line-height:1.2;display:block}
.caixa{background:#1D1815;border:1px solid var(--linha2);border-radius:12px;padding:13px 14px 10px}
.caixa:focus-within{border-color:var(--ouro)}
.caixa textarea{width:100%;background:none;border:none;color:var(--txt);resize:vertical;min-height:150px;font-size:13px;line-height:1.6;padding:0}
.caixa textarea:focus{outline:none}
.caixa .pe{display:flex;align-items:center;gap:9px;margin-top:9px;padding-top:9px;border-top:1px solid var(--linha)}
.caixa .pe span{font-size:11.5px;color:var(--fraco);flex:1}
.tog{width:34px;height:19px;border-radius:999px;background:#2E241C;border:none;cursor:pointer;position:relative;flex:none;transition:.16s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#7E7064;transition:.16s}
.tog.on{background:var(--ouro)} .tog.on::after{left:17px;background:#241B0C}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:#1D1815;border:1px solid var(--linha2);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;color:var(--fraco);transition:.14s}
.chip:hover{border-color:#4A3B2E;color:var(--creme)}
.chip.on{background:#2A1F16;border-color:var(--ouro);color:#F1DDB9;font-weight:500}
.qtd{display:flex;align-items:center;background:#1D1815;border:1px solid var(--linha2);border-radius:8px}
.qtd button{background:none;border:none;color:var(--fraco);cursor:pointer;padding:7px 11px;font-size:14px} .qtd b{min-width:16px;text-align:center;font-weight:500;font-size:12.5px}
#btnGerar{width:100%;background:linear-gradient(135deg,#D9B37A,#B8956A);color:#241B0C;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 26px rgba(184,149,106,.22);transition:.14s;margin-top:4px}
#btnGerar:hover{filter:brightness(1.07)} #btnGerar:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#status{text-align:center;color:var(--fraco);font-size:12px;margin:10px 0 0;line-height:1.5;min-height:18px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.mini button{background:none;border:none;color:var(--fraco);cursor:pointer;font-size:11.5px;text-decoration:underline;padding:0}
.mini button:hover{color:var(--ouro)}

/* ===== RESULTADO (direita) ===== */
#palco{height:100vh;overflow-y:auto;padding:30px 34px}
#palco::-webkit-scrollbar{width:10px} #palco::-webkit-scrollbar-thumb{background:var(--linha2);border-radius:8px}
.vazio{max-width:440px;margin:18vh auto 0;text-align:center;color:var(--fraco);line-height:1.7;font-size:14px}
.vazio b{display:block;font-family:var(--serif);font-size:26px;color:var(--creme);letter-spacing:.04em;margin-bottom:12px;font-weight:600}
.concept{background:linear-gradient(135deg,#231B15,#141110);border:1px solid var(--linha2);border-radius:16px;padding:26px 30px;margin-bottom:22px}
.concept .rot{font-size:10px;letter-spacing:.22em;color:var(--ouro);text-transform:uppercase;font-weight:600}
.concept h2{margin:8px 0 8px;font-family:var(--serif);font-size:27px;line-height:1.2;color:var(--creme);font-weight:600}
.concept p{margin:0;color:#B9AB9B;font-size:13.5px;line-height:1.6;max-width:72ch}
.concept .meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--linha)}
.concept .meta span{font-size:12.5px;line-height:1.5} .concept .meta b{display:block;font-size:10px;letter-spacing:.18em;color:var(--fraco);text-transform:uppercase;font-weight:600;margin-bottom:3px}
.alerta{margin-top:14px;background:#2A1512;border:1px solid #5E2E28;color:#E88A7A;border-radius:8px;padding:10px 13px;font-size:12.5px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--painel);border:1px solid var(--linha);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .cab{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--linha)}
.card .cab b{font-size:12.5px;color:var(--creme);font-weight:500} .card .cab small{color:var(--fraco);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.card .img{background:#0B0908;min-height:280px;display:flex;align-items:center;justify-content:center;position:relative}
.card .img img{width:100%;display:block}
.card .carregando{display:flex;flex-direction:column;align-items:center;gap:11px;color:var(--fraco);font-size:12px;padding:40px 20px;text-align:center}
.girando{width:26px;height:26px;border:2px solid var(--linha2);border-top-color:var(--ouro);border-radius:50%;animation:g .9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}} @media (prefers-reduced-motion:reduce){.girando{animation-duration:2.4s}}
.card pre{margin:0;white-space:pre-wrap;font-size:10.5px;line-height:1.5;color:#8F8174;padding:10px 13px;max-height:110px;overflow-y:auto;border-top:1px solid var(--linha)}
.card .acoes{display:flex;gap:6px;flex-wrap:wrap;padding:11px 13px}
.card .acoes button,.card .acoes a{flex:1;min-width:70px;background:#1D1815;border:1px solid var(--linha2);color:var(--txt);border-radius:8px;padding:8px;font-size:11.5px;cursor:pointer;text-align:center;text-decoration:none;transition:.14s;font-family:inherit}
.card .acoes button:hover,.card .acoes a:hover{border-color:var(--ouro)}
.card .acoes .ok{background:#2A1F16;border-color:var(--ouro);color:#F1DDB9;font-weight:600}
.crit{padding:0 13px 11px;font-size:12px;line-height:1.5}
.crit b{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600}
.crit .sim{color:#8FC98B;background:#152015} .crit .nao{color:#E6B26B;background:#2A1E10}
.crit ul{margin:7px 0 0;padding-left:16px;color:#D9C4A4} .crit .ok2{color:#8FC98B;font-size:11.5px;margin-top:6px}
.avisos{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 10px}
.avisos span{font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid}
.avisos .a{color:#E6B26B;border-color:#5A4322;background:#2A1E10} .avisos .c{color:#E88A7A;border-color:#5E2E28;background:#2A1512} .avisos .m{color:#D9B8A0;border-color:#4E3A2C;background:#241A14} .avisos .v{color:#8FC98B;border-color:#2F4A2D;background:#152015}
.secao{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
.secao h3{margin:0;font-family:var(--serif);font-size:21px;letter-spacing:.06em;color:var(--creme);font-weight:600}
.secao span{color:var(--fraco);font-size:12px} .secao button{margin-left:auto}

/* editor rápido */
#editor{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--painel);border-left:1px solid var(--linha);transform:translateX(100%);transition:transform .22s;z-index:50;display:flex;flex-direction:column}
#editor.on{transform:none}
#editor .cab{padding:16px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between}
#editor .cab b{font-family:var(--serif);font-size:18px;letter-spacing:.06em;color:var(--creme);font-weight:600}
#editor .cab button{background:none;border:none;color:var(--fraco);font-size:22px;cursor:pointer;line-height:1}
#editor .corpo{flex:1;overflow-y:auto;padding:16px 20px}
#editor .rod{padding:14px 20px;border-top:1px solid var(--linha)}
.campo{margin-bottom:11px} .campo label{display:block;margin-bottom:4px;color:var(--fraco);font-size:11.5px}
.campo input[type=text],.campo textarea,.campo select{width:100%;background:#1D1815;border:1px solid var(--linha2);border-radius:8px;padding:9px 10px;color:var(--txt)}
.campo textarea{min-height:70px;resize:vertical;line-height:1.5} .campo input:focus,.campo textarea:focus,.campo select:focus{outline:none;border-color:var(--ouro)}
.campo input[type=range]{width:100%;accent-color:var(--ouro)}
.check{display:flex;align-items:center;gap:8px;color:var(--fraco);cursor:pointer;margin:8px 0} .check input{accent-color:var(--ouro)}
.btn{width:100%;background:var(--ouro);color:#241B0C;border:none;border-radius:9px;padding:11px;font-weight:600;cursor:pointer}
.btn.vazado{background:none;border:1px solid var(--linha2);color:var(--txt);margin-top:8px}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(8,6,5,.84);display:none;align-items:center;justify-content:center;z-index:200;padding:24px} #modal.on{display:flex}
#modalCx{background:var(--painel);border:1px solid var(--linha2);border-radius:14px;max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:26px 30px}
#modalCx h3{margin:0 0 6px;font-family:var(--serif);font-size:24px;letter-spacing:.06em;font-weight:600} #modalCx p{color:var(--fraco);line-height:1.6;font-size:13px}
#modalCx pre{background:#120E0C;border:1px solid var(--linha2);border-radius:8px;padding:14px;overflow-x:auto;font-size:11.5px;line-height:1.55;color:#CFC3B4}
#modalCx ol{color:var(--fraco);line-height:1.75;font-size:13px;padding-left:18px} #modalCx code{background:#120E0C;padding:2px 5px;border-radius:4px;font-size:12px}
.fechar{float:right;background:none;border:none;font-size:22px;color:var(--fraco);cursor:pointer;line-height:1}
.solta{border:1.5px dashed var(--linha2);border-radius:10px;padding:24px 18px;text-align:center;color:var(--fraco);font-size:13px;line-height:1.55;cursor:pointer;transition:.14s}
.solta:hover,.solta.quente{border-color:var(--ouro);background:#1C1512;color:var(--creme)} .solta b{display:block;color:var(--creme);font-weight:500;margin-bottom:4px}
.tabela{width:100%;border-collapse:collapse;font-size:13px} .tabela th{text-align:left;color:var(--fraco);font-weight:500;font-size:11px;letter-spacing:.1em;padding:0 8px 8px;text-transform:uppercase}
.tabela td{padding:5px 8px 5px 0;border-bottom:1px solid var(--linha)} .tabela input{width:100%;background:#1D1815;border:1px solid var(--linha2);border-radius:6px;padding:6px 8px}
.semfoto{color:#8A6A4A;font-size:11px} .avisoBox{background:#2A1E14;border:1px solid #47331F;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.55;color:#E3CDA9;margin:12px 0}
.dica{color:var(--fraco);font-size:11.5px;line-height:1.5;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);background:var(--ouro);color:#241B0C;padding:12px 24px;border-radius:999px;font-weight:600;z-index:300;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{transform:translateX(-50%) translateY(0)}

/* palco de renderização (fora da tela) */
#moldura{position:fixed;left:-20000px;top:0}
#canvas{width:1080px;position:relative;overflow:hidden;background:var(--creme);font-family:var(--serif);color:var(--preto)}
#canvas.f45{height:1350px} #canvas.f11{height:1080px} #canvas.f916{height:1920px}
.tpl{display:none;position:absolute;inset:0} .tpl.on{display:block}
#safe{display:none}
/* marca d'água de logo */
.dbLogo{font-family:var(--serif);letter-spacing:.34em;font-weight:600}

/* ===== CRIATIVO 1 — confronto ===== */
#t1{background:#F8F2DA;padding:54px 56px;display:flex;flex-direction:column}
#t1 .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
#t1 .topo .marca{font-size:29px;letter-spacing:.34em;font-weight:600}
#t1 .topo .site{font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.16em;color:var(--preto)}
#t1 .kick{font-family:var(--sans);font-weight:700;font-size:23px;letter-spacing:.06em;color:var(--vermelho);margin-bottom:4px}
#t1 h2{
  font-family:var(--serif);font-weight:700;font-size:102px;line-height:.94;
  margin:0 0 20px;letter-spacing:-.012em;text-transform:uppercase;
}
#t1 .arena{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:start;min-height:0;position:relative}
#t1 .lado{padding-top:26px}
#t1 .lado .rot{display:block;font-family:var(--sans);font-weight:700;font-size:20px;letter-spacing:.09em;margin-bottom:2px}
#t1 .esq .rot{color:#6E6459}
#t1 .dir .rot{color:var(--vermelho)}
#t1 .lado .pre{display:block;font-family:var(--serif);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.008em;margin-bottom:18px}
#t1 .esq .pre{color:#6E6459}
#t1 .lado .li{font-family:var(--sans);font-size:22px;font-weight:500;padding:5px 0;line-height:1.3}
#t1 .esq .li{color:#7A7065}
#t1 .esq .li::before{content:"×";color:#A89C8E;font-weight:700;margin-right:9px}
#t1 .dir .li::after{content:" ✓";color:#2E7D32;font-weight:700}
#t1 .frascoBox{display:flex;align-items:flex-start;justify-content:center;height:100%;min-height:0;padding-top:4px}
#t1 .frascoBox img{max-height:560px;max-width:100%;object-fit:contain;filter:drop-shadow(0 26px 34px rgba(0,0,0,.24))}
#t1 .selo{
  position:absolute;right:0;bottom:24px;width:186px;height:186px;border-radius:50%;
  background:var(--vermelho);color:#fff;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:var(--sans);box-shadow:0 12px 28px rgba(0,0,0,.2);
}
#t1 .selo b{font-size:48px;line-height:1;font-weight:700}
#t1 .selo span{font-size:17px;margin-top:3px}
#t1 .rodape{margin-top:26px;text-align:center}
#t1 .cta{
  display:inline-block;background:#fff;color:var(--preto);font-family:var(--sans);
  font-weight:700;font-size:27px;letter-spacing:.05em;padding:20px 66px;border-radius:999px;
  box-shadow:0 6px 20px rgba(0,0,0,.09);
}
#t1 .tag{font-family:var(--sans);font-size:20px;color:#5F564C;margin-top:20px}
#t1 .legal{font-family:var(--sans);font-size:16px;color:#8A8074;margin-top:14px}

/* ===== CRIATIVO 2 — print ===== */
#t2{background:#F4F1EA;display:flex;flex-direction:column}
#t2 .barra{background:#F6F4F1;padding:20px 26px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #E2DCD3}
#t2 .voltar{font-size:30px;color:#8C8378;line-height:1;margin-right:2px}
#t2 .av{width:56px;height:56px;border-radius:50%;background:#C3BCD4;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:23px;font-weight:600;overflow:hidden;flex:none}
#t2 .av img{width:100%;height:100%;object-fit:cover}
#t2 .quem{font-family:var(--sans);line-height:1.15}
#t2 .quem b{display:block;font-size:26px;font-weight:600;color:#17150F}
#t2 .quem span{font-size:17px;color:#8C8378}
#t2 .fluxo{
  flex:1;padding:24px 26px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:11px;overflow:hidden;
  background-color:#D8D0C4;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.4) 2.5px,transparent 3px),
                   radial-gradient(circle at 68% 42%,rgba(255,255,255,.34) 2px,transparent 2.5px),
                   radial-gradient(circle at 34% 78%,rgba(255,255,255,.3) 2.5px,transparent 3px);
  background-size:230px 260px,190px 210px,270px 240px;
}
#t2 .bal{
  max-width:66%;padding:14px 17px 24px;border-radius:11px;position:relative;
  font-family:var(--sans);font-size:25px;line-height:1.36;color:#17150F;
  box-shadow:0 1px 1px rgba(0,0,0,.09);
}
#t2 .bal .hr{position:absolute;right:13px;bottom:6px;font-size:15px;color:#9A9287}
#t2 .rec{background:#FFFFFF;align-self:flex-start;border-top-left-radius:3px}
#t2 .env{background:#E4F2D2;align-self:flex-end;border-top-right-radius:3px}
#t2 .env .hr{color:#8A9A78}
#t2 .env .hr::after{content:" ✓✓";color:#4D9FE0;letter-spacing:-.12em}
#t2 .bal.foto{padding:7px 7px 24px;background:#E4F2D2;align-self:flex-end;max-width:40%}

const LIB={};
const LOGO={clara:'',escura:''};   // clara = para fundo escuro · escura = para fundo claro
let db=null;
function abrirDB(){
  return new Promise(res=>{
    const r=indexedDB.open('deobeauty_frascos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img');
    r.onsuccess=()=>{db=r.result;res(db);};
    r.onerror=()=>res(null);
  });
}
function libSalvar(slug,dataUrl){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const tx=db.transaction('img','readwrite');
    tx.objectStore('img').put(dataUrl,slug);
    tx.oncomplete=()=>{LIB[slug]=dataUrl;res();};
    tx.onerror=()=>res();
  });
}
function libApagar(slug){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const tx=db.transaction('img','readwrite');
    tx.objectStore('img').delete(slug);
    tx.oncomplete=()=>{delete LIB[slug];res();};
    tx.onerror=()=>res();
  });
}
function logoSalvar(qual,dataUrl){ LOGO[qual]=dataUrl; return libSalvar('__logo_'+qual,dataUrl); }
function logoCarregar(){ LOGO.clara=LIB['__logo_clara']||''; LOGO.escura=LIB['__logo_escura']||''; }

function libCarregar(){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const st=db.transaction('img','readonly').objectStore('img');
    const rq=st.openCursor();
    rq.onsuccess=e=>{
      const c=e.target.result;
      if(c){LIB[c.key]=c.value;c.continue();} else res();
    };
    rq.onerror=()=>res();
  });
}
function reduzir(file,largura=1200){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const fator=Math.min(1,largura/im.width);
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*fator); cv.height=Math.round(im.height*fator);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/png'));
      };
      im.onerror=()=>rej(new Error('imagem inválida'));
      im.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('falha na leitura'));
    fr.readAsDataURL(file);
  });
}
function casarSlug(nome){
  const limpo=nome.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[_\s]+/g,'-')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'');
  let achado=PERFUMES.find(p=>p.s===limpo);
  if(achado)return achado.s;
  achado=PERFUMES.find(p=>limpo.includes(p.s)||p.s.includes(limpo));
  if(achado)return achado.s;
  achado=PERFUMES.find(p=>{
    const n=p.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
    return limpo.replace(/-/g,'').includes(n);
  });
  return achado?achado.s:null;
}

const SAFE_PX={f916:{topo:250,base:420},f45:{topo:0,base:150},f11:{topo:0,base:130}};

function conferirPeca(){
  const avisos=[];
  const cv=$('#canvas'), r0=cv.getBoundingClientRect();
  const escala=r0.width/1080;                 // o canvas está reduzido na tela
  const alto=cv.offsetHeight;
  const z=SAFE_PX[D.formato]||SAFE_PX.f45;
  const sec=$('.tpl.on'); if(!sec) return avisos;

  // 1. texto invadindo a área coberta pelo app
  const textos=[...sec.querySelectorAll('h2,.cta,.kick,.lead,.sub,.li,.pre,.selo,.bal,.nota,.rot,.tag,.legal,.btn6,.lbl')]
    .filter(el=>el.offsetParent!==null && el.textContent.trim());
  let invadeTopo=0, invadeBase=0;
  textos.forEach(el=>{
    const r=el.getBoundingClientRect();
    const top=(r.top-r0.top)/escala, bot=(r.bottom-r0.top)/escala;
    if(z.topo && top<z.topo) invadeTopo++;
    if(bot>alto-z.base) invadeBase++;
  });
  if(invadeTopo) avisos.push({n:'alerta',t:`${invadeTopo} elemento(s) de texto no topo, onde o app cobre (${z.topo}px)`});
  if(invadeBase) avisos.push({n:'alerta',t:`${invadeBase} elemento(s) de texto embaixo, onde ficam os botões (${z.base}px)`});

  // 2. regras da marca e do CONAR
  const tudo=vars([D.t1.head,D.t3.lead,D.t5.head,D.t5.sub,D.t6.head,D.t6.sub,D.t4.head,D.t2.msgs].join(' ')).toLowerCase();
  if(/\b(o melhor|a melhor|n[úu]mero 1|o mais vendido|l[íi]der)\b/.test(tudo)) avisos.push({n:'conar',t:'superlativo sem prova ("o melhor", "líder") — o CONAR exige comprovação'});
  if(/\b(igual ao|id[êe]ntico|mesma f[óo]rmula|c[óo]pia)\b/.test(tudo)) avisos.push({n:'conar',t:'promessa de identidade com marca alheia — evite "igual ao", "mesma fórmula"'});
  if(/\b(cliente|depoimento|comprei e|recomendo)\b/.test(tudo) && D.tpl!==2) avisos.push({n:'marca',t:'parece depoimento de cliente — a marca não usa prova social'});
  if(D.tpl===2&&!D.t2.encenacao) avisos.push({n:'marca',t:'conversa sem o selo de encenação — é depoimento fabricado'});
  if(!D.cta.trim()) avisos.push({n:'alerta',t:'peça sem CTA'});
  const semFoto=!fotoDe(perf())&&!D.fotoCustom;
  if(semFoto&&[1,3,5].includes(D.tpl)) avisos.push({n:'alerta',t:'sem foto do frasco — a peça vai sair com espaço vazio'});
  if(!LOGO.escura&&!LOGO.clara) avisos.push({n:'dica',t:'logo ainda em texto — envie os arquivos da logo em Colar briefing'});
  return avisos;
}

/* ==================== LEITOR DE BRIEFING ==================== */
/* ==================== LEITOR DE BRIEFING ==================== */
const semAcento=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const ROTULOS=[
 {k:'criativo',  re:/^criativo\b/},
 {k:'ref',       re:/^referencia\s+visual/},
 {k:'direcao',   re:/^direcionamento\s+visual/},
 {k:'kicker',    re:/^kicker/},
 {k:'cabecalho', re:/^cabecalho/},
 {k:'headline',  re:/^(opcoes\s+de\s+)?headline/},
 {k:'sub',       re:/^subheadline/},
 {k:'baloes',    re:/^baloes/},
 {k:'selo',      re:/^selo/},
 {k:'cta',       re:/^cta\b/}
];

function normalizarVars(t){
  return String(t)
    .replace(/\{\s*produto\s*\}/gi,'{PERFUME}')
    .replace(/\[\s*perf\.?\s*deobeauty\s*\]/gi,'{PERFUME}')
    .replace(/\[\s*nome\s+do\s+(perfume|produto)\s*\]/gi,'{PERFUME}')
    .replace(/\{\s*(volume\s+da\s+)?ess[êe]ncia\s*\}/gi,'{ESSENCIA}')
    .replace(/\{\s*pre[çc]o_por\s*\}/gi,'{POR}')
    .replace(/\{\s*pre[çc]o_de\s*\}/gi,'{DE}')
    .replace(/\{\s*desconto\s*\}/gi,'{OFF}')
    .replace(/\{\s*r\$\s*[\d.,]+\s*\}/gi,'{POR}')
    .replace(/\[\s*vol\.?\s*\]/gi,'{VOLUME}')
    .replace(/\[\s*pre[çc]o\s*\]/gi,'{POR}')
    .replace(/\[\s*categoria\s*\]/gi,'{CATEG}');
}

function lerBriefing(txt){
  const linhas=txt.split('\n').map(l=>l.replace(/\s+$/,''));
  const bloco={}; let atual=null;
  linhas.forEach(l=>{
    const nu=semAcento(l.trim().replace(/[:：]\s*$/,''));
    const achado=ROTULOS.find(r=>r.re.test(nu));
    if(achado && nu.length<64){
      atual=achado.k;
      bloco[atual]=bloco[atual]||[];
      const resto=l.split(/[:：]/).slice(1).join(':').trim();
      if(resto) bloco[atual].push(resto);
      if(achado.k==='criativo'){
        const m=l.match(/(\d+)/); if(m) bloco.num=parseInt(m[1],10);
      }
      return;
    }
    if(atual && l.trim()) bloco[atual].push(l.trim());
  });
  return bloco;
}

function aplicarBriefing(txt){
  const b=lerBriefing(txt);
  const pegou=[], faltou=[];
  const junta=k=>(b[k]||[]).map(normalizarVars).join(' ').trim();
  const lista=k=>(b[k]||[]).map(normalizarVars);

  if(b.num&&b.num>=1&&b.num<=6){ D.tpl=b.num; pegou.push('criativo '+b.num); }
  const hh=(b.headline||[]).map(normalizarVars).filter(l=>!/^\d+[.)]/.test(l)).join(' ').trim();
  if(hh) G.headline=hh;
  const ss=(b.sub||[]).map(normalizarVars).join(' ').trim();
  if(ss) G.sub=ss;

  // CTA — sempre respeitado
  const cta=junta('cta');
  if(cta){ D.cta=cta.replace(/\[.*?\]/g,'').trim()||cta; pegou.push('CTA'); }
  else faltou.push('CTA (mantive o atual)');

  // selo → preços
  const selo=junta('selo');
  if(selo){
    const vals=[...selo.matchAll(/r\$\s*([\d.]+,\d{2})/gi)].map(m=>m[1]);
    const off=selo.match(/(\d{1,2})\s*%/);
    if(vals.length>=2){ D.padrao={de:vals[0],por:vals[1]}; D.de=vals[0]; D.por=vals[1]; pegou.push('preços do selo'); }
    else if(vals.length===1){ D.padrao={de:D.padrao.de,por:vals[0]}; D.por=vals[0]; pegou.push('preço do selo'); }
    if(off){ D.off=off[1]+'%'; }
    if(D.tpl===5) D.t5.selo=selo.replace(/^apenas\s*/i,'').trim()||D.t5.selo;
  }

  const kick=junta('kicker'), head=lista('headline'), sub=lista('sub');

  if(D.tpl===1){
    if(kick){ D.t1.kick=kick; pegou.push('kicker'); }
    if(head.length){ D.t1.head=head.join(' '); pegou.push('headline'); }
    const pares=sub.filter(l=>l.includes('|')).map(l=>l.split('|').map(x=>x.trim()));
    if(pares.length>=2){
      D.t1.colA=pares[0][0]||D.t1.colA; D.t1.colB=pares[0][1]||D.t1.colB;
      const itens=pares.slice(1);
      const comPreco=itens.filter(l=>/r\$|\{POR\}|\{DE\}/i.test(l.join(' ')));
      const semPreco=itens.filter(l=>!/r\$|\{POR\}|\{DE\}/i.test(l.join(' ')));
      if(comPreco.length){
        D.t1.preA=(comPreco[0][0]||'').replace(/^.*?(r\$\s*[\d.,]+|\{POR\}|\{DE\}).*$/i,'$1');
        D.t1.preB=(comPreco[0][1]||'').replace(/^.*?(r\$\s*[\d.,]+|\{POR\}|\{DE\}).*$/i,'$1')||'R$ {POR}';
      }
      ['a1','a2','a3'].forEach((k,i)=>{ D.t1[k]=semPreco[i]?semPreco[i][0]:''; });
      ['b1','b2','b3'].forEach((k,i)=>{ D.t1[k]=semPreco[i]?semPreco[i][1]:''; });
      pegou.push('confronto de preços');
    } else if(sub.length) faltou.push('tabela do confronto — separe as colunas com |');
  }

  if(D.tpl===2){
    if(kick){
      const nome=kick.split('\n')[0].replace(/\[|\]/g,'').replace(/online/i,'')
        .replace(/[^\p{L}\p{N}\s'.-]/gu,'').trim();
      if(nome && !/nome da amiga/i.test(nome)){ D.t2.amiga=nome; pegou.push('nome da amiga'); }
    }
    const bal=lista('baloes').filter(l=>/\[(recebido|enviado)\]/i.test(l));
    if(bal.length){
      D.t2.msgs=bal.map(l=>{
        const env=/\[enviado\]/i.test(l);
        let t=l.replace(/\[(recebido|enviado)\]\s*/i,'').trim();
        if(/^\[?\s*foto\b/i.test(t)) t='[foto]';
        return (env?'e: ':'r: ')+t;
      }).join('\n');
      pegou.push(bal.length+' balões');
    } else faltou.push('balões — precisam vir marcados com [recebido] / [enviado]');
  }

  if(D.tpl===3){
    const cab=lista('cabecalho');
    if(cab.length>1){ D.t3.editoria=cab[cab.length-1].toUpperCase(); pegou.push('editoria'); }
    const ops=head.filter(l=>/^\d+[.)]/.test(l)).map(l=>l.replace(/^\d+[.)]\s*/,''));
    if(ops.length){ D.heads3=ops; D.t3.headIdx=0; pegou.push(ops.length+' headlines'); }
    else if(head.length){ D.heads3=[head.join(' ')]; D.t3.headIdx=0; pegou.push('headline'); }
    if(sub.length){ D.t3.lead=sub.join(' '); pegou.push('subheadline'); }
  }

  if(D.tpl===4){
    if(head.length){ D.t4.head=head.join(' ').toLowerCase(); pegou.push('headline'); }
    sub.forEach(l=>{
      const m=l.match(/^(.+?):\s*(.+)$/);
      if(!m)return;
      const rot=semAcento(m[1]);
      if(rot.includes('efeito')){ D.t4.r1t=m[1]+':'; D.t4.r1=m[2]; }
      else if(rot.includes('nao serve')||rot.includes('para quem')){ D.t4.r2t=m[1]+':'; D.t4.r2=m[2]; }
      else if(rot.includes('valor')||rot.includes('preco')){ D.t4.r3t=m[1]+':'; }
    });
    if(sub.length) pegou.push('nota de papel');
  }

  if(D.tpl===5){
    if(head.length){
      D.t5.head=head[0];
      if(head[1]) D.t5.sub=head.slice(1).join(' ')+(sub.length?' '+sub.join(' '):'');
      pegou.push('headline');
    }
    if(sub.length && !head[1]){ D.t5.sub=sub.join(' '); pegou.push('subheadline'); }
  }

  if(D.tpl===6){
    if(head.length){ D.t6.head=head.join(' '); pegou.push('headline'); }
    if(sub.length){ D.t6.sub=sub.join(' '); pegou.push('subheadline'); }
    const c=junta('cta');
    if(c){
      const partes=c.split(/\n|\[/)[0].trim();
      if(partes) D.t6.lbl=partes;
    }
  }

  return {pegou,faltou};
}

const MOTOR_FIXO='https://deobeauty-motor.larissa-vieira.workers.dev';
const WORKER='db_motor';
const getWorker=()=>{ if(MOTOR_FIXO) return MOTOR_FIXO; try{return localStorage.getItem(WORKER)||'';}catch(e){return '';} };
const modoTecnico=()=>/[?&#](config|tecnico)/.test(location.search+location.hash);
async function worker(corpo){
  const url=getWorker(); if(!url) throw new Error('o motor ainda não está ligado nesta instalação');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});
  const j=await r.json();
  if(!r.ok||j.erro) throw new Error(typeof j.erro==='string'?j.erro:'o serviço recusou o pedido');
  return j;
}
const soBase64=d=>String(d).replace(/^data:[^;]+;base64,/,'');
async function editarImagem(dataUrl,tipo,aoTerminar){
  let j=await worker({acao:'editar',tipo,image:soBase64(dataUrl),formato:D.formato});
  if(j.tarefa){
    for(let i=0;i<20;i++){
      await new Promise(r=>setTimeout(r,3000));
      const t=await worker({acao:'tarefa',tarefa:j.tarefa,rota:j.rota||tipo});
      if(t.image){ j={image:t.image}; break; }
      if(t.status==='FAILED') throw new Error('o serviço não conseguiu processar');
    }
  }
  if(!j.image) throw new Error('demorou demais, tente de novo');
  const img=(j.image.startsWith('http')||j.image.startsWith('data:'))?j.image:'data:image/png;base64,'+j.image;
  await aoTerminar(img);
  return img;
}

  if(G.pessoa==='mulher') partes.push('uma mulher adulta na cena, de costas ou parcialmente fora de quadro, sem rosto em destaque');
  partes.push(LUZES[G.luz]);
  partes.push(CLIMAS[G.clima]);
  if(G.extra.trim()&&CENAS[G.cena]&&CENAS[G.cena].b) partes.push(G.extra.trim());
  let txt=partes.join(', ')+'.';
  if(G.headline.trim()) txt+=` A cena precisa transmitir esta ideia, sem escrevê-la: "${G.headline.trim()}".`;
  return txt+' '+m.cauda(FORMATOS_TXT[D.formato]||'vertical 4:5');
}

const INSTRUCAO_TEXTO = `Você recebe um briefing de anúncio para a DeoBeauty, marca brasileira de perfumaria (eau de parfum, 20% de essência, R$ 99,90). O texto pode vir estruturado ou solto, como um recado.
Responda SOMENTE com um objeto JSON, sem markdown, sem crases, sem texto antes ou depois:

{
  "criativo": número de 1 a 6 ou null,
  "perfume": nome do perfume citado, ou "",
  "kicker": "", "headline": "", "subheadline": "", "cta": "",
  "precoDe": "359,99" ou "", "precoPor": "99,90" ou "",
  "baloes": [ {"de":"amiga"|"marca","texto":"..."} ] ou [],
  "cena": uma frase em português descrevendo o cenário da foto, se o briefing pedir cena, ou "",
  "amiga": nome da amiga se for conversa, ou "",
  "duvidas": uma frase curta com o que ficou ambíguo, ou ""
}

Criativos: 1 = comparação de preço com importado · 2 = print de conversa · 3 = notícia/manchete · 4 = frase escrita no vidro embaçado · 5 = vários frascos em fundo escuro · 6 = stories espontâneo.
Se o texto não disser qual criativo, escolha pelo conteúdo: menção a importado ou "R$ 800" → 1; diálogo → 2; tom de notícia → 3; banheiro/espelho/vidro → 4; "linha", "coleção", vários perfumes → 5; tom pessoal de stories → 6.
Transcreva as frases exatamente como estão. Placeholders como {PRODUTO}, [Nome do perfume], {PREÇO_POR} devem ser mantidos como vieram. Não invente preço nem frase que não esteja no texto.`;

async function entenderPorIA(txt){
  const j=await worker({acao:'entender',texto:txt,instrucao:INSTRUCAO_TEXTO});
  const limpo=String(j.texto||'').replace(/```json|```/g,'').trim();
  const a=limpo.indexOf('{'), b=limpo.lastIndexOf('}');
  if(a<0||b<0) throw new Error('resposta ilegível');
  return JSON.parse(limpo.slice(a,b+1));
}

function aplicarEntendimento(r){
  const pegou=[];
  if(r.perfume){
    const alvo=semAcento(r.perfume);
    const ach=PERFUMES.find(p=>alvo.includes(semAcento(p.n))||semAcento(p.n).includes(alvo));
    if(ach){ D.perfume=ach.s; aplicarPreco(ach.s); pegou.push('perfume: '+ach.n); }
  }
  if(r.criativo>=1&&r.criativo<=7){ D.tpl=r.criativo; pegou.push(NOMES[r.criativo-1]); }
  if(r.cta){ D.cta=r.cta; pegou.push('CTA'); }
  if(r.precoDe){ D.de=r.precoDe; D.padrao.de=r.precoDe; }
  if(r.precoPor){ D.por=r.precoPor; D.padrao.por=r.precoPor; }
  if(r.precoDe&&r.precoPor){
    const a=parseFloat(r.precoDe.replace(/\./g,'').replace(',','.')), b=parseFloat(r.precoPor.replace(/\./g,'').replace(',','.'));
    if(a>0&&b>0&&b<a){ D.off=Math.round((1-b/a)*100)+'%'; pegou.push('preços'); }
  }
  if(r.headline){ G.headline=normalizarVars(r.headline); }
  if(r.subheadline){ G.sub=normalizarVars(r.subheadline); }
  if(r.kicker&&D.tpl===1) D.t1.kick=r.kicker;
  if(r.kicker&&D.tpl===3) D.t3.editoria=r.kicker.toUpperCase();
  if(Array.isArray(r.baloes)&&r.baloes.length){
    D.t2.msgs=r.baloes.map(b=>(b.de==='marca'?'e: ':'r: ')+normalizarVars(b.texto||'')).join('\n');
    pegou.push(r.baloes.length+' balões');
  }
  if(r.amiga&&!/nome da amiga/i.test(r.amiga)) D.t2.amiga=r.amiga;
  if(r.cena){ if(D.tpl===4) D.t4.prompt=r.cena; if(D.tpl===6) D.t6.prompt=r.cena; G.extra=r.cena; G.cena='livre'; pegou.push('cena'); }
  const f=aplicarTextos(); pegou.push(...f);
  return {pegou,duvidas:r.duvidas||''};
}

/* ==================== DIRETOR CRIATIVO ==================== */
/* Este é o cérebro. Ele foi escrito com as regras que a Larissa já usa nos
   fluxos dela: o frasco é autoridade, texto integrado à cena, CTA curto,
   referência é qualidade de render e não cópia, lifestyle sem prova social. */
const SISTEMA_DIRETOR = `Você é o diretor criativo sênior da DeoBeauty, perfumaria brasileira. Você pensa como um designer com quinze anos de tráfego pago em beleza: cada peça tem UM conceito, UM ponto focal e UMA leitura em dois segundos. Você detesta imagem que parece feita por IA — brilho excessivo, simetria perfeita, frasco flutuando, cena vazia de intenção.

A MARCA
- Eau de parfum, 20% de essência, padrão internacional feito no Brasil. Preço de linha R$ 99,90.
- Paleta sóbria: marfim/off-white/bege como base (70%), preto e marrom estruturais (20%), dourado e rosa claro como acento (10%). O rosa é tempero, nunca protagonista.
- Personalidade: elegante, sofisticada, feminina, acolhedora, premium sem ser vulgar.
- Tipografia: Recline nos títulos e detalhes, Poppins em textos longos.
- Comunica valor em três pilares: mostrar as notas; provar performance ("deixa rastro, dura o dia"); tornar o perfume a marca da pessoa ("todo mundo sabe que sou eu porque uso o Valen").
- NUNCA usa depoimento de cliente, repost, prova social ou bastidores. Prefere lifestyle aspiracional: o frasco em cenas de vida.

REGRAS DE PRODUÇÃO (não negociáveis)
1. O frasco real vai como imagem de referência (@PRODUTO). Formato, cor, rótulo e tampa são autoridade absoluta — proibido inventar ou alterar. Se a cena mostra aplicação ou borrifo, o frasco está ABERTO, tampa fora; se só está segurando ou exposto, FECHADO.
2. Texto dentro da imagem só quando for CTA curto (máximo duas linhas, sem emoji) e sempre como objeto 3D integrado à cena: gravado em pedra, letreiro de metal, relevo em vidro, neon, letras de acrílico — nunca sobreposição plana. O texto obedece à luz e às sombras da cena. Textos longos, preços e comparações ficam FORA da imagem, na camada de layout.
3. Composição cinematográfica: primeiro plano com bokeh, plano médio nítido com o produto, fundo com profundidade. Regra dos terços ou centralização deliberada — nunca "meio que centralizado".
4. Luz com origem clara e motivo (janela, abajur, fim de tarde). Nada de luz uniforme de estúdio a menos que o briefing peça foto de e-commerce.
5. Referências visuais de outras marcas servem apenas para qualidade de render e tratamento de texto — jamais copiar fundo, logo, cor ou identidade delas.
6. Sempre três variações reais, que mudem conceito ou enquadramento — não a mesma cena com palavra trocada.
7. Pessoas: adultas, sem rosto em destaque a menos que o briefing traga @REF de identidade. Mãos e gestos contam mais que expressão.

COMO VOCÊ ENTREGA
Responda SOMENTE com JSON, sem markdown:
{
  "conceito": "uma frase: a ideia por trás da peça",
  "porque": "uma frase: por que essa ideia vende para público frio de tráfego",
  "ponto_focal": "o que o olho vê primeiro",
  "texto_na_imagem": "" ou o CTA curto que vai integrado em 3D (máximo 2 linhas),
  "texto_fora": { "headline": "...", "subheadline": "...", "cta": "..." },
  "variacoes": [
    { "nome": "3 palavras", "prompt": "prompt completo em inglês, 120 a 200 palavras, descrevendo cena, câmera, lente, luz, materiais, posição exata do @PRODUTO, tratamento do texto 3D se houver, e terminando com as restrições: no extra text, no logos, no watermark, natural skin, no plastic look" },
    { ... }, { ... }
  ],
  "formato": "4:5" ou "9:16",
  "alerta": "" ou o que no briefing conflita com a marca ou com o CONAR
}
Os prompts começam sempre com "Using the attached product photo as absolute reference for the bottle (@PRODUTO)". Escreva o prompt como quem dirige um fotógrafo, não como quem lista tags.`;

const APROVADOS='db_aprovados';
const lerAprovados=()=>{try{return JSON.parse(localStorage.getItem(APROVADOS)||'[]');}catch(e){return [];}};
function aprovar(item){
  const a=lerAprovados();
  a.unshift({quando:new Date().toISOString(),conceito:item.conceito||'',prompt:item.prompt,perfume:item.perfume});
  try{localStorage.setItem(APROVADOS,JSON.stringify(a.slice(0,30)));}catch(e){}
  toast('Aprovada — entra como referência nas próximas direções');
}

async function dirigir(briefing){
  const p=perf();
  const aprovados=lerAprovados().slice(0,5);
  const memoria=aprovados.length
    ? `\n\nPEÇAS QUE A LARISSA APROVOU RECENTEMENTE (calibre o gosto por elas, sem copiar):\n`+aprovados.map((a,i)=>`${i+1}. ${a.conceito} — ${a.prompt.slice(0,220)}…`).join('\n')
    : '';
  const pedido=`BRIEFING RECEBIDO:\n${briefing}`+guiaDeGosto()+`\n\nPERFUME: ${p.n}${p.i?' (inspirado em '+p.i+')':''} · ${p.f||''} · ${D.volume} · ${D.essencia} de essência · de R$ ${D.de} por R$ ${D.por}.\nCRIATIVO ESCOLHIDO: ${D.tpl} (${NOMES[D.tpl-1]}). Formato de saída da campanha: feed 4:5 e stories 9:16.${memoria}\n\nPense como diretor, depois escreva.`;
  const j=await worker({acao:'dirigir',sistema:SISTEMA_DIRETOR,pedido});
  const limpo=String(j.texto||'').replace(/```json|```/g,'').trim();
  const a=limpo.indexOf('{'), b=limpo.lastIndexOf('}');
  if(a<0||b<0) throw new Error('o diretor não respondeu em formato legível');
  return JSON.parse(limpo.slice(a,b+1));
}

async function refsDoProduto(){
  // frasco real como referência de imagem; estilo, se houver
  const refs=[];
  const foto=D.fotoCustom||fotoDe(perf());
  const paraB64=async src=>{
    if(!src) return null;
    if(src.startsWith('data:')) return {tipo:src.slice(5,src.indexOf(';')),data:soBase64(src)};
    try{ const r=await fetch(src); const bl=await r.blob();
      const d=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(bl);});
      return {tipo:bl.type||'image/png',data:soBase64(d)}; }catch(e){ return null; }
  };
  const f=await paraB64(foto); if(f) refs.push(f);
  const e=await paraB64(G.estilo); if(e) refs.push(e);
  return refs;
}

/* ---------- o botão ---------- */
async function gerar(){
  const txt=(D.brief||'').trim(); if(!txt){toast('Cole o briefing primeiro');return;}
  const b=$('#btnGerar'), st=$('#status');
  b.disabled=true; b.textContent='Lendo…'; salvar();
  const ligados=await checarMotores();
  const temIA=!!(getWorker()&&ligados.claude&&D.entender);

  // 1. entender
  let r;
  if(temIA){ st.textContent='Entendendo o briefing…'; try{ r=aplicarEntendimento(await entenderPorIA(txt)); }catch(e){ r=aplicarBriefing(txt); } }
  else r=aplicarBriefing(txt);
  if(D.tipo) D.tpl=D.tipo;                        // a pessoa escolheu o criativo
  if(!r||!r.pegou.length){ st.textContent='Não reconheci nada nesse texto.'; b.disabled=false; b.textContent='Gerar'; return; }
  renderForm(); $('#btnGerar').disabled=true; $('#btnGerar').textContent='Pensando…';

  // 2. sem IA, ou criativo que não usa cena: fecha o layout com a foto
  const precisaCena=[4,6,7].includes(D.tpl);
  if(!temIA || !precisaCena){
    $('#status').textContent='Montando as peças…';
    DIR=null; await fecharLayout(D.tpl);
    $('#status').textContent=r.faltou&&r.faltou.length?'Pronto. Não reconheci: '+r.faltou.join(' · '):'Pronto.';
    $('#btnGerar').disabled=false; $('#btnGerar').textContent='Gerar'; return;
  }

  // 3. com IA e criativo de cena: o diretor pensa e produz
  try{
    $('#status').textContent='O diretor está desenhando a peça…';
    DIR=await dirigir(txt);
    if(DIR.texto_fora){ if(DIR.texto_fora.headline) G.headline=DIR.texto_fora.headline; if(DIR.texto_fora.subheadline) G.sub=DIR.texto_fora.subheadline; if(DIR.texto_fora.cta) D.cta=DIR.texto_fora.cta; aplicarTextos(); }
    DIR.variacoes=(DIR.variacoes||[]).slice(0,D.qtd);
    salvar(); renderPalco();
    $('#status').textContent='Produzindo as variações…';
    for(let i=0;i<DIR.variacoes.length;i++) await produzirVar(i);
    $('#status').textContent='Pronto. Escolha a variação e feche a peça.';
  }catch(e){ $('#status').textContent='Não deu: '+e.message; }
  $('#btnGerar').disabled=false; $('#btnGerar').textContent='Gerar';
}

async function fecharLayout(tpl){
  PECAS.length=0; renderPalco();
  for(const f of FORMATOS){
    try{ const {img,avisos}=await renderizar(tpl,f); PECAS.push({nome:NOMES[tpl-1],fmt:rotuloFmt[f],slug:perf().s,tpl,img,avisos}); }
    catch(e){ PECAS.push({nome:NOMES[tpl-1],fmt:rotuloFmt[f],erro:e.message}); }
    renderPalco();
  }
}

async function produzirVar(i,promptForcado){
  const v=DIR.variacoes[i]; v.img=null; v.erro=null; v.carregando=true; renderPalco();
  try{
    const ligados=await checarMotores();
    if(!ligados[MOTORES[G.motor].chave]) throw new Error(`${MOTORES[G.motor].nome} não está ligado`);
    const prompt=promptForcado||v.prompt;
    const refs=MOTOR_API[G.motor]==='google'?await refsDoProduto():[];
    const j=await worker({acao:'gerar',motor:MOTOR_API[G.motor],prompt,formato:'f45',refs});
    const img=j.image?((j.image.startsWith('data:')||j.image.startsWith('http'))?j.image:'data:image/png;base64,'+j.image):null;
    if(!img) throw new Error('não veio imagem');
    v.img=img; v.promptUsado=prompt; v.carregando=false; renderPalco();
    if(D.autoCritica) avaliarVar(i);
  }catch(e){ v.erro=e.message; v.carregando=false; renderPalco(); }
}
async function avaliarVar(i){
  const v=DIR.variacoes[i]; v.avaliando=true; renderPalco();
  try{ v.critica=await criticar(v.img,v.promptUsado||v.prompt); }catch(e){ v.critica={erro:e.message}; }
  v.avaliando=false; renderPalco();
}
async function fecharPeca(i){
  const v=DIR.variacoes[i];
  const alvo=D.tpl===4?4:D.tpl===6?6:7;
  if(alvo===4) D.bg4=v.img; else if(alvo===6) D.bg6=v.img; else D.bg7=v.img;
  if(DIR.texto_fora){ if(DIR.texto_fora.headline){D.t7.head=DIR.texto_fora.headline;} if(DIR.texto_fora.subheadline){D.t7.sub=DIR.texto_fora.subheadline;} }

}

];

function cors(req) {
  const o = req.headers.get("Origin") || "";
  return {
    "Access-Control-Allow-Origin": PERMITIDOS.includes(o) ? o : PERMITIDOS[0],
    "Access-Control-Allow-Headers": "Content-Type",
    "Access-Control-Allow-Methods": "POST, OPTIONS"
  };
}

let CORS = {};
const json = (o, st) => new Response(JSON.stringify(o), {
  status: st || 200,
  headers: { ...CORS, "Content-Type": "application/json" }
});

// proporção pedida, traduzida para o que cada serviço entende
const TAM = {
  freepik: { f45: "traditional_3_4", f916: "social_story_9_16", f11: "square_1_1" },
  openai:  { f45: "1024x1536",       f916: "1024x1536",         f11: "1024x1024"  },
  google:  { f45: "4:5",             f916: "9:16",              f11: "1:1"        }
};

export default {
  async fetch(req, env) {
    CORS = cors(req);
    if (req.method === "OPTIONS") return new Response(null, { headers: CORS });
    if (req.method !== "POST") return json({ erro: "use POST" }, 405);

    const origem = req.headers.get("Origin") || "";
    if (origem && !PERMITIDOS.includes(origem)) return json({ erro: "origem não autorizada" }, 403);

    const body = await req.json();
    const acao = body.acao || "gerar";
    const fmt  = body.formato || "f45";

    // ---------- quais motores estão ligados ----------
    if (acao === "motores") {
      return json({
        freepik:  !!env.FREEPIK_KEY,
        seedream: !!env.FREEPIK_KEY,
        google:   !!env.GOOGLE_KEY,
        openai:   !!env.OPENAI_KEY,
        claude:   !!env.ANTHROPIC_KEY
      });
    }

    // ---------- gerar imagem ----------
    if (acao === "gerar") {
      const motor = body.motor || "freepik";

      // --- Nano Banana 2 (Google) ---
      if (motor === "google" || motor === "nano") {
        if (!env.GOOGLE_KEY) return json({ erro: "motor do Google não configurado" }, 400);
        const url = "https://generativelanguage.googleapis.com/v1beta/models/"
          + MODELO_GOOGLE + ":generateContent?key=" + env.GOOGLE_KEY;
        const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: body.prompt }] }],
              generationConfig: {
                responseModalities: ["IMAGE"],
                imageConfig: { aspectRatio: TAM.google[fmt] }
              }
            })
        });
        const d = await r.json();
        if (!r.ok) return json({ erro: d }, r.status);
        const parte = (d?.candidates?.[0]?.content?.parts || [])
          .find(x => x.inlineData || x.inline_data);
        const b64 = parte?.inlineData?.data || parte?.inline_data?.data || null;
        return b64 ? json({ image: b64 }) : json({ erro: "o modelo não devolveu imagem" }, 502);
      }

      // --- GPT Image (OpenAI) ---
      if (motor === "openai" || motor === "gpt") {
        if (!env.OPENAI_KEY) return json({ erro: "motor da OpenAI não configurado" }, 400);
        const r = await fetch("https://api.openai.com/v1/images/generations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + env.OPENAI_KEY
          },
          body: JSON.stringify({
            model: MODELO_OPENAI,
            prompt: body.prompt,
            size: TAM.openai[fmt],
            n: 1
          })
        });
        const d = await r.json();
        if (!r.ok) return json({ erro: d }, r.status);
        return json({ image: d?.data?.[0]?.b64_json || d?.data?.[0]?.url || null });
      }

      // --- Freepik / Seedream ---
      if (!env.FREEPIK_KEY) return json({ erro: "motor da Freepik não configurado" }, 400);
      const r = await fetch("https://api.freepik.com/v1/ai/text-to-image", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-freepik-api-key": env.FREEPIK_KEY },
        body: JSON.stringify({
          prompt: body.prompt,
          num_images: 1,
          image: { size: TAM.freepik[fmt] }
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ image: d?.data?.[0]?.base64 || d?.data?.[0]?.url || null });
    }

    // ---------- editar imagem (Freepik) ----------
    // acao: "editar" | body.tipo: "fundo" (remover) | "ampliar" (Magnific) | "expandir"
    if (acao === "editar") {
      if (!env.FREEPIK_KEY) return json({ erro: "motor da Freepik não configurado" }, 400);

      const ROTAS = {
        fundo:    "https://api.freepik.com/v1/ai/beta/remove-background",
        ampliar:  "https://api.freepik.com/v1/ai/image-upscaler",
        expandir: "https://api.freepik.com/v1/ai/image-expand"
      };
      const rota = ROTAS[body.tipo || "fundo"];
      if (!rota) return json({ erro: "tipo de edição desconhecido" }, 400);

      const corpo = { image: body.image };
      if (body.tipo === "ampliar") corpo.scale_factor = body.escala || "2x";
      if (body.tipo === "expandir") corpo.image_size = TAM.freepik[fmt];

      const r = await fetch(rota, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-freepik-api-key": env.FREEPIK_KEY },
        body: JSON.stringify(corpo)
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);

      // alguns desses respondem em duas etapas: devolvem um id e ficam prontos depois
      const id = d?.data?.task_id || d?.task_id;
      const pronta = d?.data?.generated?.[0] || d?.data?.base64 || d?.data?.url || null;
      if (pronta) return json({ image: pronta });
      if (id) return json({ tarefa: id, rota: body.tipo });
      return json({ erro: "o serviço não devolveu imagem" }, 502);
    }

    // ---------- consultar tarefa ----------
    if (acao === "tarefa") {
      const ROTAS = {
        fundo:    "https://api.freepik.com/v1/ai/beta/remove-background/",
        ampliar:  "https://api.freepik.com/v1/ai/image-upscaler/",
        expandir: "https://api.freepik.com/v1/ai/image-expand/"
      };
      const r = await fetch((ROTAS[body.rota] || ROTAS.ampliar) + body.tarefa, {
        headers: { "x-freepik-api-key": env.FREEPIK_KEY }
      });
      const d = await r.json();
      return json({
        status: d?.data?.status || "desconhecido",
        image: d?.data?.generated?.[0] || d?.data?.base64 || d?.data?.url || null
      });
    }

    // ---------- direção criativa (Claude pensa a peça e escreve os prompts) ----------
    if (acao === "dirigir") {
      if (!env.ANTHROPIC_KEY) return json({ erro: "direção criativa não configurada" }, 400);
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": env.ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 2500,
          system: body.sistema,
          messages: [{ role: "user", content: body.pedido }]
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ texto: (d.content || []).filter(c => c.type === "text").map(c => c.text).join("\n") });
    }

    // ---------- entender briefing em texto livre (Claude) ----------
    if (acao === "entender") {
      if (!env.ANTHROPIC_KEY) return json({ erro: "leitura por IA não configurada" }, 400);
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": env.ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          messages: [{ role: "user", content: body.instrucao + "\n\n=== TEXTO RECEBIDO ===\n" + body.texto }]
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ texto: (d.content || []).filter(c => c.type === "text").map(c => c.text).join("\n") });
    }

    // ---------- ler referência (Claude) ----------
    if (acao === "ler") {
      if (!env.ANTHROPIC_KEY) return json({ erro: "leitura de referência não configurada" }, 400);
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": env.ANTHROPIC_KEY,
          "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1200,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: body.tipo || "image/png", data: body.image } },
              { type: "text", text: body.instrucao }
            ]
          }]
        })
      });
      const d = await r.json();
      if (!r.ok) return json({ erro: d }, r.status);
      return json({ texto: (d.content || []).filter(c => c.type === "text").map(c => c.text).join("\n") });
    }

    return json({ erro: "ação desconhecida" }, 400);
  }
};</pre><button class="btn" id="wCopiar">Copiar o código</button>`);
  $('#wCopiar').onclick=()=>navigator.clipboard.writeText($('#codeW').textContent).then(()=>toast('Copiado'));
}
