<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeoBeauty · Gerador de Estáticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600;700&family=Caveat:wght@500;700&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  /* marca */
  --dourado:#B8956A;
  --marrom:#6B4E3D;
  --preto:#141414;
  --creme:#F8F5EE;
  --marfim:#EFE8DC;
  --rosa:#E8C9C4;
  --branco:#FFFFFF;
  --vermelho:#B22222;
  /* chrome do app */
  --app-bg:#171311;
  --app-panel:#201A17;
  --app-linha:#312823;
  --app-txt:#EDE4D9;
  --app-txt-fraco:#9A8B7D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--app-bg);
  color:var(--app-txt);
  font-family:'Jost',system-ui,sans-serif;
  font-size:14px;
  display:grid;
  grid-template-columns:372px 1fr;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}

/* ---------- RAIL ---------- */
#rail{
  background:var(--app-panel);
  border-right:1px solid var(--app-linha);
  height:100vh;display:flex;flex-direction:column;
}
#railTopo{padding:18px 20px 14px;border-bottom:1px solid var(--app-linha)}
#railTopo h1{
  margin:0;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:24px;font-weight:600;letter-spacing:.14em;color:var(--creme);
}
#railTopo p{margin:3px 0 0;color:var(--app-txt-fraco);font-size:12.5px;letter-spacing:.04em}

#abas{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px;border-bottom:1px solid var(--app-linha)}
.aba{
  background:transparent;border:1px solid var(--app-linha);color:var(--app-txt-fraco);
  border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;transition:.15s;
}
.aba:hover{border-color:var(--dourado);color:var(--creme)}
.aba[aria-selected="true"]{background:var(--dourado);border-color:var(--dourado);color:#2A1E14;font-weight:600}

#campos{flex:1;overflow-y:auto;padding:16px 20px 26px}
#campos::-webkit-scrollbar{width:9px}
#campos::-webkit-scrollbar-thumb{background:var(--app-linha);border-radius:9px}

.grupo{margin-bottom:22px}
.grupo > h2{
  margin:0 0 11px;font-size:11px;letter-spacing:.18em;font-weight:600;
  color:var(--dourado);text-transform:uppercase;
}
.campo{margin-bottom:11px}
.campo label{display:block;margin-bottom:4px;color:var(--app-txt-fraco);font-size:12px}
.campo input[type=text],.campo input[type=number],.campo select,.campo textarea{
  width:100%;background:#120E0C;border:1px solid var(--app-linha);
  border-radius:7px;padding:8px 10px;transition:border-color .15s;
}
.campo textarea{min-height:128px;resize:vertical;line-height:1.55;font-size:13px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--dourado);outline:none}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.dica{color:var(--app-txt-fraco);font-size:11.5px;line-height:1.5;margin:6px 0 0}
.check{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer;color:var(--app-txt-fraco)}
.check input{accent-color:var(--dourado);width:15px;height:15px}

.btn{
  width:100%;background:var(--dourado);color:#2A1E14;border:none;border-radius:7px;
  padding:10px;font-weight:600;cursor:pointer;letter-spacing:.03em;transition:.15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.vazado{background:transparent;border:1px solid var(--app-linha);color:var(--app-txt)}
.btn.vazado:hover{border-color:var(--dourado);filter:none}
.btn + .btn{margin-top:8px}

.avisoBox{
  background:#2A1E14;border:1px solid #47331F;border-radius:8px;
  padding:10px 12px;font-size:12px;line-height:1.55;color:#E3CDA9;margin-bottom:14px;
}

/* ---------- PALCO ---------- */
#palco{height:100vh;display:flex;flex-direction:column;overflow:hidden}
#barra{
  display:flex;align-items:center;gap:10px;padding:12px 22px;
  border-bottom:1px solid var(--app-linha);background:var(--app-panel);flex-wrap:wrap;
}
#barra select,#barra button{
  background:#120E0C;border:1px solid var(--app-linha);border-radius:7px;padding:7px 11px;cursor:pointer;
}
#barra button:hover{border-color:var(--dourado)}
#barra .spacer{flex:1}
#barra .primario{background:var(--dourado);border-color:var(--dourado);color:#2A1E14;font-weight:600}
#zoomLbl{color:var(--app-txt-fraco);font-size:12px;min-width:42px;text-align:center}

#area{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:36px}
#area::-webkit-scrollbar{width:11px;height:11px}
#area::-webkit-scrollbar-thumb{background:var(--app-linha);border-radius:9px}
#moldura{transform-origin:top center;transition:transform .12s}

/* ---------- CANVAS ---------- */
#canvas{
  width:1080px;position:relative;overflow:hidden;background:var(--creme);
  box-shadow:0 26px 70px rgba(0,0,0,.6);
  font-family:'Cormorant Garamond',Georgia,serif;color:var(--preto);
}
#canvas.f45{height:1350px}
#canvas.f11{height:1080px}
#canvas.f916{height:1920px}
.tpl{display:none;position:absolute;inset:0}
.tpl.on{display:block}

/* safezones */
#safe{position:absolute;inset:0;pointer-events:none;z-index:90;display:none}
#safe.on{display:block}
#safe div{position:absolute;left:0;right:0;background:rgba(178,34,34,.13);border-color:rgba(178,34,34,.55);border-style:dashed}
#safe .topo{top:0;border-bottom-width:2px;border-width:0 0 2px}
#safe .base{bottom:0;border-top-width:2px;border-width:2px 0 0}
#safe span{position:absolute;right:16px;font-family:'Jost';font-size:19px;letter-spacing:.14em;color:rgba(178,34,34,.85)}

/* marca d'água de logo */
.dbLogo{font-family:'Cormorant Garamond',serif;letter-spacing:.34em;font-weight:600}

/* ===== CRIATIVO 1 — comparativo ===== */
#t1{background:linear-gradient(170deg,#FBF8F2 0%,#F1E7D6 100%);padding:58px 62px;display:flex;flex-direction:column}
#t1 .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}
#t1 .topo .marca{font-size:31px;letter-spacing:.34em;font-weight:600}
#t1 .topo .site{font-family:'Jost';font-size:17px;letter-spacing:.2em;color:var(--marrom)}
#t1 .kick{font-family:'Jost';font-weight:600;font-size:21px;letter-spacing:.2em;color:var(--vermelho);margin-bottom:10px}
#t1 h2{
  font-family:'Archivo Black',sans-serif;font-size:82px;line-height:.94;
  margin:0 0 40px;letter-spacing:-.018em;text-transform:uppercase;max-width:15ch;
}
#t1 .comp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--preto);background:var(--branco)}
#t1 .comp .col{padding:24px 26px}
#t1 .comp .col:first-child{border-right:2px solid var(--preto);background:#F3EFE7;color:#6E6459}
#t1 .comp .ch{font-family:'Jost';font-weight:700;font-size:24px;letter-spacing:.03em;margin-bottom:16px;line-height:1.2}
#t1 .comp .li{font-family:'Jost';font-size:23px;padding:9px 0;line-height:1.35}
#t1 .comp .col:first-child .li{text-decoration:line-through;text-decoration-thickness:1px}
#t1 .comp .col:last-child .li{font-weight:500}
#t1 .comp .col:last-child .li::before{content:"✓ ";color:#2E7D32;font-weight:700}
#t1 .meio{display:flex;align-items:flex-end;gap:30px;margin-top:38px;flex:1}
#t1 .frasco{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;min-height:0}
#t1 .frasco img{max-height:430px;max-width:100%;object-fit:contain;filter:drop-shadow(0 22px 30px rgba(0,0,0,.22))}
#t1 .selo{
  width:212px;height:212px;border-radius:50%;background:var(--vermelho);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Jost';transform:rotate(-9deg);flex:none;box-shadow:0 14px 34px rgba(0,0,0,.28);
}
#t1 .selo b{font-size:58px;line-height:1;font-weight:700}
#t1 .selo span{font-size:19px;margin-top:6px;text-align:center;line-height:1.25;padding:0 14px}
#t1 .rodape{margin-top:34px;text-align:center}
#t1 .cta{
  display:inline-block;background:var(--preto);color:var(--creme);font-family:'Jost';
  font-weight:600;font-size:26px;letter-spacing:.14em;padding:19px 62px;border-radius:999px;
}
#t1 .legal{font-family:'Jost';font-size:16px;color:#7A6F63;margin-top:16px;letter-spacing:.02em}

/* ===== CRIATIVO 2 — conversa ===== */
#t2{background:#ECE4DB;display:flex;flex-direction:column}
#t2 .barra{background:var(--branco);padding:26px 30px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #DED5CA}
#t2 .voltar{font-size:38px;color:#9A8B7D;line-height:1}
#t2 .av{width:74px;height:74px;border-radius:50%;background:var(--marrom);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Jost';font-size:30px;font-weight:600;overflow:hidden}
#t2 .av img{width:100%;height:100%;object-fit:cover}
#t2 .quem{font-family:'Jost'}
#t2 .quem b{display:block;font-size:31px;font-weight:600}
#t2 .quem span{font-size:20px;color:#67A867}
#t2 .fluxo{flex:1;padding:28px 30px;display:flex;flex-direction:column;gap:14px;overflow:hidden;background:#E9E0D6}
#t2 .bal{max-width:74%;padding:16px 20px 26px;border-radius:16px;position:relative;font-family:'Jost';font-size:26px;line-height:1.38}
#t2 .bal .hr{position:absolute;right:14px;bottom:7px;font-size:16px;color:#8A8177}
#t2 .rec{background:var(--branco);align-self:flex-start;border-top-left-radius:4px}
#t2 .env{background:#D9EFD0;align-self:flex-end;border-top-right-radius:4px}
#t2 .env .hr{color:#6C8C63}
#t2 .env .hr::after{content:" ✓✓";color:#3B8FD6}
#t2 .bal.foto{padding:12px 12px 26px;background:#D9EFD0;align-self:flex-end;max-width:46%}
#t2 .bal.foto img{width:100%;border-radius:10px;display:block;background:#fff}
#t2 .encenacao{align-self:center;background:rgba(20,20,20,.72);color:#F3EDE4;font-family:'Jost';font-size:19px;letter-spacing:.05em;padding:9px 22px;border-radius:999px;margin-bottom:4px}
#t2 .pe{background:var(--creme);padding:26px 30px 32px;text-align:center;border-top:1px solid #DED5CA}
#t2 .pe .marca{font-size:26px;letter-spacing:.34em;margin-bottom:16px;display:block}
#t2 .cta{display:block;background:var(--preto);color:var(--creme);font-family:'Jost';font-weight:600;font-size:26px;letter-spacing:.14em;padding:19px;border-radius:999px}

/* ===== CRIATIVO 3 — Deo News ===== */
#t3{background:var(--creme);display:flex;flex-direction:column}
#t3 .cab{background:var(--preto);color:var(--creme);padding:22px 34px;display:flex;justify-content:space-between;align-items:center}
#t3 .cab .esq{display:flex;align-items:baseline;gap:16px}
#t3 .cab .marca{font-size:28px;letter-spacing:.3em}
#t3 .cab .news{font-family:'Jost';font-size:24px;letter-spacing:.4em;font-weight:500}
#t3 .cab .data{font-family:'Jost';font-size:15px;letter-spacing:.12em;color:#9A8B7D}
#t3 .corpo{padding:34px 40px 0;flex:1;display:flex;flex-direction:column}
#t3 .ed{font-family:'Jost';font-weight:700;font-size:19px;letter-spacing:.2em;color:var(--vermelho);margin-bottom:14px}
#t3 h2{
  font-family:'Archivo Black',sans-serif;font-size:58px;line-height:1.02;margin:0 0 26px;
  text-transform:uppercase;letter-spacing:-.015em;
}
#t3 .foto{background:#EDE6DA;border-radius:4px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#t3 .foto img{max-height:100%;max-width:70%;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(0,0,0,.2))}
#t3 .cred{font-family:'Jost';font-size:15px;color:#8A7F72;margin:12px 0 18px}
#t3 .lead{font-family:'Jost';font-size:25px;line-height:1.5;max-width:62ch}
#t3 .lead b{font-weight:600}
#t3 .pe{padding:26px 40px 34px}
#t3 .cta{display:block;background:var(--preto);color:var(--creme);text-align:center;font-family:'Jost';font-weight:600;font-size:26px;letter-spacing:.14em;padding:19px;border-radius:999px}

/* ===== CRIATIVO 4 — fumaça do box ===== */
#t4{background:#4A4440;position:relative;overflow:hidden}
#t4 .bg{position:absolute;inset:0;background-size:cover;background-position:center}
#t4 .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.05) 45%,rgba(0,0,0,.42) 100%)}
#t4 .cont{position:absolute;inset:0;padding:66px 58px;display:flex;flex-direction:column}
#t4 h2{
  font-family:'Caveat',cursive;font-size:96px;line-height:1.02;margin:0;font-weight:700;
  color:rgba(255,255,255,.92);text-shadow:0 2px 18px rgba(0,0,0,.35);max-width:17ch;
  transform:rotate(-1.4deg);
}
#t4 .nota{
  background:#FBF7EC;color:#2B2622;width:475px;padding:30px 32px;margin-top:auto;
  font-family:'Jost';box-shadow:0 20px 44px rgba(0,0,0,.4);transform:rotate(-2.2deg);
}
#t4 .nota .l{margin-bottom:15px;font-size:23px;line-height:1.4}
#t4 .nota .l:last-child{margin-bottom:0}
#t4 .nota b{font-weight:700;display:block;margin-bottom:2px}
#t4 .nota .de{text-decoration:line-through;color:#8A7F72;margin-right:12px}
#t4 .nota .por{font-size:38px;font-weight:700}
#t4 .frasco{position:absolute;right:52px;bottom:120px;width:300px}
#t4 .frasco img{width:100%;filter:drop-shadow(0 24px 34px rgba(0,0,0,.55))}
#t4 .cta{
  position:absolute;left:58px;right:58px;bottom:46px;background:var(--preto);color:var(--creme);
  text-align:center;font-family:'Jost';font-weight:600;font-size:26px;letter-spacing:.14em;
  padding:19px;border-radius:999px;
}

/* ===== CRIATIVO 5 — fileira ===== */
#t5{background:radial-gradient(120% 80% at 50% 0%,#2E241D 0%,#141010 72%);color:var(--creme);padding:56px 50px;display:flex;flex-direction:column;align-items:center;text-align:center}
#t5 .marca{font-size:29px;letter-spacing:.36em;margin-bottom:44px;color:var(--dourado)}
#t5 .fila{display:flex;justify-content:center;align-items:flex-end;gap:34px;width:100%}
#t5 .fila .it{flex:1;max-width:266px}
#t5 .fila .it img{width:100%;height:330px;object-fit:contain;filter:drop-shadow(0 20px 28px rgba(0,0,0,.6))}
#t5 .fila .it span{display:block;font-family:'Jost';font-size:16px;letter-spacing:.18em;color:var(--dourado);margin-top:16px}
#t5 h2{font-size:78px;line-height:1.04;margin:46px 0 14px;font-weight:600;font-style:italic;max-width:16ch}
#t5 h2 em{color:var(--dourado);font-style:italic}
#t5 .sub{font-family:'Jost';font-size:24px;color:#C9BBA9;line-height:1.5;max-width:44ch}
#t5 .sub b{color:var(--creme);font-weight:500}
#t5 .fundo{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-top:auto;width:100%;opacity:.55}
#t5 .fundo img{width:120px;height:190px;object-fit:contain}
#t5 .selo{
  position:absolute;right:62px;bottom:250px;width:200px;height:200px;border-radius:50%;
  background:var(--dourado);color:#2A1E14;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'Jost';transform:rotate(-11deg);box-shadow:0 14px 34px rgba(0,0,0,.5);
}
#t5 .selo small{font-size:19px;letter-spacing:.1em}
#t5 .selo b{font-size:50px;line-height:1;font-weight:700}
#t5 .cta{margin-top:26px;background:var(--creme);color:var(--preto);font-family:'Jost';font-weight:600;font-size:25px;letter-spacing:.14em;padding:18px 60px;border-radius:999px}

/* ===== CRIATIVO 6 — stories orgânico ===== */
#t6{background:#3B342E;position:relative;overflow:hidden}
#t6 .bg{position:absolute;inset:0;background-size:cover;background-position:center}
#t6 .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%)}
#t6 .cont{position:absolute;inset:0;padding:270px 68px 300px;display:flex;flex-direction:column}
#t6 h2{
  font-family:'Jost';font-style:italic;font-weight:700;font-size:62px;line-height:1.14;
  color:#fff;margin:0;text-shadow:0 3px 16px rgba(0,0,0,.5);max-width:16ch;
}
#t6 .sub{
  font-family:'Jost';font-style:italic;font-weight:600;font-size:34px;line-height:1.3;
  color:#fff;margin-top:34px;max-width:22ch;text-shadow:0 3px 14px rgba(0,0,0,.5);
}
#t6 .link{margin-top:auto}
#t6 .link .lbl{font-family:'Jost';font-size:26px;color:#fff;margin-bottom:14px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#t6 .link .btn6{
  display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.92);color:#141414;
  border-radius:14px;padding:18px 24px;font-family:'Jost';font-size:27px;font-weight:500;width:fit-content;
}
#t6 .link .btn6 i{font-style:normal;font-size:24px}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(10,7,6,.82);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#modal.on{display:flex}
#modalCx{background:var(--app-panel);border:1px solid var(--app-linha);border-radius:12px;max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:26px 30px}
#modalCx h3{margin:0 0 6px;font-family:'Cormorant Garamond',serif;font-size:25px;letter-spacing:.06em}
#modalCx p{color:var(--app-txt-fraco);line-height:1.6;font-size:13px}
#modalCx pre{background:#120E0C;border:1px solid var(--app-linha);border-radius:8px;padding:14px;overflow-x:auto;font-size:11.5px;line-height:1.55;color:#CFC3B4}
#modalCx ol{color:var(--app-txt-fraco);line-height:1.75;font-size:13px;padding-left:18px}
#modalCx code{background:#120E0C;padding:2px 5px;border-radius:4px;font-size:12px}
.fechar{float:right;background:none;border:none;font-size:22px;color:var(--app-txt-fraco);cursor:pointer;line-height:1}

#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120%);
  background:var(--dourado);color:#2A1E14;padding:12px 26px;border-radius:999px;font-weight:600;
  z-index:300;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- LOTE / TABELAS ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.chip{
  background:#120E0C;border:1px solid var(--app-linha);border-radius:7px;padding:6px 11px;
  cursor:pointer;font-size:12.5px;color:var(--app-txt-fraco);transition:.13s;user-select:none;
}
.chip:hover{border-color:var(--dourado)}
.chip.on{background:var(--dourado);border-color:var(--dourado);color:#2A1E14;font-weight:600}
.minis{display:flex;gap:7px;margin-bottom:10px}
.minis button{background:none;border:none;color:var(--dourado);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;color:var(--app-txt-fraco);font-weight:500;font-size:11.5px;letter-spacing:.1em;padding:0 8px 8px;text-transform:uppercase}
.tabela td{padding:4px 8px 4px 0;border-bottom:1px solid #251E1A}
.tabela td:first-child{color:var(--app-txt);width:44%}
.tabela input{width:100%;background:#120E0C;border:1px solid var(--app-linha);border-radius:6px;padding:6px 8px;font-size:13px}
.tabela input:focus{border-color:var(--dourado);outline:none}
.tabela .semfoto{color:#8A6A4A;font-size:11px}

const perf=()=>PERFUMES.find(p=>p.s===D.perfume)||PERFUMES[0];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function vars(txt){
  const p=perf();
  return String(txt||'')
    .replace(/\{PERFUME\}/g,p.n).replace(/\{INSPIRACAO\}/g,p.i||'—')
    .replace(/\{FAMILIA\}/g,p.f||'—').replace(/\{CATEG\}/g,D.categ)
    .replace(/\{VOLUME\}/g,D.volume).replace(/\{ESSENCIA\}/g,D.essencia)
    .replace(/\{DE\}/g,D.de).replace(/\{POR\}/g,D.por).replace(/\{OFF\}/g,D.off);
}

function ligarBinds(){
  $$('[data-bind]').forEach(el=>{
    el.oninput=()=>{
      const [a,b]=el.dataset.bind.split('.');
      const v=(b==='headIdx')?parseInt(el.value,10):el.value;
      if(b) D[a][b]=v; else D[a]=v;
      if(b==='headIdx') montarEspec();
      pintar();salvar();
    };
    if(el.tagName==='SELECT') el.onchange=el.oninput;
  });
  const enc=$('#c2enc'); if(enc) enc.onchange=()=>{D.t2.encenacao=enc.checked;pintar();salvar();};
  lerArquivo('#btnAvatar','#fAvatar',d=>{D.avatarCustom=d;pintar();});

  lerArquivo('#btnBg6','#fBg6',d=>{D.bg6=d;pintar();toast('Fundo aplicado');});
  const i4=$('#btnIA4'); if(i4) i4.onclick=()=>gerarIA(4);
  const i6=$('#btnIA6'); if(i6) i6.onclick=()=>gerarIA(6);
  const lt=$('#btnLote'); if(lt) lt.onclick=lote3;
}
function lerArquivo(btnSel,inpSel,cb){
  const b=$(btnSel),i=$(inpSel); if(!b||!i)return;
  b.onclick=()=>i.click();
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);};
}

function pintar(){
  const p=perf();
  const foto=D.fotoCustom||LIB[p.s]||drive(p.t);
  $$('[data-img="frasco"]').forEach(im=>{im.crossOrigin='anonymous';im.src=foto;});
  $('#fotoStatus').textContent = D.fotoCustom ? 'Imagem enviada agora, só para esta peça.'
    : LIB[p.s] ? 'Foto guardada. Vale para todas as peças deste perfume.'
    : 'Sem foto ainda — envie aqui ou em Frascos.';

  const set=(sel,txt,html)=>{const el=$(sel);if(el){if(html)el.innerHTML=vars(txt);else el.textContent=vars(txt);}};

  // 1
  set('#t1 [data-f=site]',D.t1.site); set('#t1 [data-f=kick]',D.t1.kick);
  set('#t1 [data-f=head]',D.t1.head);
  ['colA','a1','a2','a3','colB','b1','b2','b3','legal'].forEach(k=>set(`#t1 [data-f=${k}]`,D.t1[k]));
  set('#t1 [data-f=cta]',D.cta);
  set('#t1 [data-f=seloOff]','-'+D.off.replace('%','')+'%');
  set('#t1 [data-f=seloTxt]','de R$ '+D.de);

  // 2
  set('#t2 [data-f=amiga]',D.t2.amiga); set('#t2 [data-f=cta]',D.cta);
  const av=$('#t2 [data-f=avatar]');
  av.innerHTML = D.avatarCustom ? `<img src="${D.avatarCustom}" alt="">` : esc((D.t2.amiga||'A').trim()[0]||'A').toUpperCase();
  const fx=$('#t2fluxo'); fx.innerHTML='';
  if(D.t2.encenacao){const e=document.createElement('div');e.className='encenacao';e.textContent='encenação';fx.appendChild(e);}
  let [hh,mm]=(D.t2.horaIni||'21:46').split(':').map(Number);
  if(isNaN(hh)){hh=21;mm=46;}
  D.t2.msgs.split('\n').filter(l=>l.trim()).forEach((linha,idx)=>{
    const env=/^e\s*:/i.test(linha);
    const txt=linha.replace(/^[re]\s*:\s*/i,'');
    if(idx>0&&idx%2===0){mm++;if(mm>59){mm=0;hh=(hh+1)%24;}}
    const hora=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    const d=document.createElement('div');
    if(/^\[foto\]$/i.test(txt.trim())){
      d.className='bal foto';
      d.innerHTML=`<img crossorigin="anonymous" src="${foto}" alt=""><span class="hr">${hora}</span>`;
    }else{
      d.className='bal '+(env?'env':'rec');
      d.innerHTML=`${esc(vars(txt))}<span class="hr">${hora}</span>`;
    }
    fx.appendChild(d);
  });

  // 3
  set('#t3 [data-f=editoria]',D.t3.editoria);
  const h3 = D.t3.headIdx==-1 ? D.t3.headLivre : (heads()[D.t3.headIdx]||heads()[0]);
  set('#t3 [data-f=head]',h3);
  set('#t3 [data-f=lead]',D.t3.lead);
  set('#t3 [data-f=cred]',`${p.n}, ${D.categ} de ${D.volume}, da DeoBeauty · Foto: divulgação`);
  set('#t3 [data-f=cta]',D.cta);
  $('#t3 [data-f=data]').textContent='BELEZA · '+new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}).toUpperCase();

  // 4
  ['head','r1t','r1','r2t','r2','r3t'].forEach(k=>set(`#t4 [data-f=${k}]`,D.t4[k]));
  set('#t4 [data-f=cta]',D.cta);
  set('#t4 [data-f=de]','R$ '+D.de); set('#t4 [data-f=por]','R$ '+D.por);
  $('#t4 .bg').style.backgroundImage = D.bg4?`url(${D.bg4})`:'none';

  // 5
  const fila=$('#t5fila'); fila.innerHTML='';
  [D.t5.p1,D.t5.p2,D.t5.p3].forEach(s=>{
    const x=PERFUMES.find(q=>q.s===s)||PERFUMES[0];
    const d=document.createElement('div');d.className='it';
    d.innerHTML=`<img crossorigin="anonymous" src="${LIB[x.s]||drive(x.t)}" alt=""><span>${esc((x.f||x.n).toUpperCase())}</span>`;
    fila.appendChild(d);
  });
  const fundo=$('#t5fundo'); fundo.innerHTML='';
  PERFUMES.filter(x=>x.t&&![D.t5.p1,D.t5.p2,D.t5.p3].includes(x.s)).slice(0,6).forEach(x=>{
    const im=document.createElement('img');im.crossOrigin='anonymous';im.src=LIB[x.s]||drive(x.t);fundo.appendChild(im);
  });
  set('#t5 [data-f=head]',D.t5.head,true); set('#t5 [data-f=sub]',D.t5.sub,true);
  set('#t5 [data-f=selo]',D.t5.selo); set('#t5 [data-f=cta]',D.cta);

  // 6
  ['head','sub','lbl','cta'].forEach(k=>set(`#t6 [data-f=${k}]`,D.t6[k]));
  $('#t6 .bg').style.backgroundImage = D.bg6?`url(${D.bg6})`:'none';
}

/* ==================== EXPORT ==================== */
async function capturar(escala){
  const m=$('#moldura'), sz=$('#safe'), t=m.style.transform, vis=sz.classList.contains('on');
  m.style.transform='none'; sz.classList.remove('on');
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,140));
  try{
    return await html2canvas($('#canvas'),{scale:escala||1,useCORS:true,allowTaint:false,backgroundColor:null,logging:false});
  } finally {
    m.style.transform=t; if(vis) sz.classList.add('on');
  }
}
function baixar(canvas,nome){
  try{
    const a=document.createElement('a');
    a.download=nome; a.href=canvas.toDataURL('image/png'); a.click();
  }catch(e){
    toast('Imagem do Drive bloqueou o download — envie o frasco pelo botão');
  }
}
const FORMATOS=['f45','f916'];
const rotuloFmt={f45:'1080x1350',f11:'1080x1080',f916:'1080x1920'};

async function capturarFormato(f,escala){
  const antes=D.formato;
  D.formato=f; $('#canvas').className=f;
  pintar(); await esperarImagens();
  const cv=await capturar(escala);
  D.formato=antes; $('#canvas').className=antes; pintar();
  return cv;
}
$('#btnPng').onclick=async()=>{
  const b=$('#btnPng'), s=$('#sBaixar');
  const trava=(t,on)=>{if(t){t.disabled=on;}};
  trava(b,true); trava(s,true);
  const txtB=b.textContent, txtS=s?s.textContent:'';
  b.textContent='Gerando…'; if(s) s.textContent='Gerando os dois formatos…';
  let falhou=0;
  for(const f of FORMATOS){
    try{
      const cv=await capturarFormato(f,D.escala||1);
      const suf=(D.escala||1)>1?'_2x':'';
      baixar(cv,`DB_C${D.tpl}_${perf().s}_${rotuloFmt[f]}${suf}.png`);
      await new Promise(r=>setTimeout(r,380));
    }catch(e){ falhou++; }
  }
  trava(b,false); trava(s,false);
  b.textContent=txtB; if(s) s.textContent=txtS;
  toast(falhou?'Um dos formatos falhou — veja a Ajuda':'Feed e stories baixados');
};
async function lote3(){
  const orig=D.t3.headIdx;
  for(let i=0;i<heads().length;i++){
    D.t3.headIdx=i; pintar();
    const c=await capturar();
    baixar(c,`deobeauty-3-${perf().s}-headline${i+1}.png`);
    await new Promise(r=>setTimeout(r,420));
  }
  D.t3.headIdx=orig; render(); toast('7 arquivos gerados');
}

const WORKER='db_freepik_worker';
const getWorker=()=>{try{return localStorage.getItem(WORKER)||'';}catch(e){return '';}};

async function gerarIA(n){
  const url=getWorker();
  if(!url){ modalFreepik(); toast('Configure o endereço do Worker primeiro'); return; }
  const btn=$('#btnIA'+n); btn.disabled=true; btn.textContent='Gerando…';
  try{
    const r=await fetch(url,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:(n===4?D.t4.prompt:D.t6.prompt),aspect:D.formato==='f916'?'vertical_9_16':'social_story_9_16'})
    });

/* ==================== BIBLIOTECA DE FRASCOS (IndexedDB) ==================== */
const LIB={};
let db=null;
function abrirDB(){
  return new Promise(res=>{
    const r=indexedDB.open('deobeauty_frascos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('img');
    r.onsuccess=()=>{db=r.result;res(db);};
    r.onerror=()=>res(null);
  });
}
function libSalvar(slug,dataUrl){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const tx=db.transaction('img','readwrite');
    tx.objectStore('img').put(dataUrl,slug);
    tx.oncomplete=()=>{LIB[slug]=dataUrl;res();};
    tx.onerror=()=>res();
  });
}
function libApagar(slug){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const tx=db.transaction('img','readwrite');
    tx.objectStore('img').delete(slug);
    tx.oncomplete=()=>{delete LIB[slug];res();};
    tx.onerror=()=>res();
  });
}
function libCarregar(){
  if(!db)return Promise.resolve();
  return new Promise(res=>{
    const st=db.transaction('img','readonly').objectStore('img');
    const rq=st.openCursor();
    rq.onsuccess=e=>{
      const c=e.target.result;
      if(c){LIB[c.key]=c.value;c.continue();} else res();
    };
    rq.onerror=()=>res();
  });
}
function reduzir(file,largura=1200){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const fator=Math.min(1,largura/im.width);
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*fator); cv.height=Math.round(im.height*fator);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/png'));
      };
      im.onerror=()=>rej(new Error('imagem inválida'));
      im.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('falha na leitura'));
    fr.readAsDataURL(file);
  });
}
function casarSlug(nome){
  const limpo=nome.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[_\s]+/g,'-')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'');
  let achado=PERFUMES.find(p=>p.s===limpo);
  if(achado)return achado.s;
  achado=PERFUMES.find(p=>limpo.includes(p.s)||p.s.includes(limpo));
  if(achado)return achado.s;
  achado=PERFUMES.find(p=>{
    const n=p.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
    return limpo.replace(/-/g,'').includes(n);
  });
  return achado?achado.s:null;
}

  a.href=URL.createObjectURL(blob);

  if(e.key>='1'&&e.key<='6'){D.tpl=+e.key;render();}
  if(e.key==='b'||e.key==='B') modalLote();
  if((e.key==='s'||e.key==='S')&&!e.metaKey&&!e.ctrlKey) $('#btnPng').click();
});

/* ==================== LEITOR DE BRIEFING ==================== */
const semAcento=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const ROTULOS=[
 {k:'criativo',  re:/^criativo\b/},
 {k:'ref',       re:/^referencia\s+visual/},
 {k:'direcao',   re:/^direcionamento\s+visual/},
 {k:'kicker',    re:/^kicker/},
 {k:'cabecalho', re:/^cabecalho/},
 {k:'headline',  re:/^(opcoes\s+de\s+)?headline/},
 {k:'sub',       re:/^subheadline/},
 {k:'baloes',    re:/^baloes/},
 {k:'selo',      re:/^selo/},
 {k:'cta',       re:/^cta\b/}
];

function normalizarVars(t){
  return String(t)
    .replace(/\{\s*produto\s*\}/gi,'{PERFUME}')
    .replace(/\[\s*perf\.?\s*deobeauty\s*\]/gi,'{PERFUME}')
    .replace(/\[\s*nome\s+do\s+(perfume|produto)\s*\]/gi,'{PERFUME}')
    .replace(/\{\s*(volume\s+da\s+)?ess[êe]ncia\s*\}/gi,'{ESSENCIA}')
    .replace(/\{\s*pre[çc]o_por\s*\}/gi,'{POR}')
    .replace(/\{\s*pre[çc]o_de\s*\}/gi,'{DE}')
    .replace(/\{\s*desconto\s*\}/gi,'{OFF}')
    .replace(/\{\s*r\$\s*[\d.,]+\s*\}/gi,'{POR}')
    .replace(/\[\s*vol\.?\s*\]/gi,'{VOLUME}')
    .replace(/\[\s*pre[çc]o\s*\]/gi,'{POR}')
    .replace(/\[\s*categoria\s*\]/gi,'{CATEG}');
}

function lerBriefing(txt){
  const linhas=txt.split('\n').map(l=>l.replace(/\s+$/,''));
  const bloco={}; let atual=null;
  linhas.forEach(l=>{
    const nu=semAcento(l.trim().replace(/[:：]\s*$/,''));
    const achado=ROTULOS.find(r=>r.re.test(nu));
    if(achado && nu.length<64){
      atual=achado.k;
      bloco[atual]=bloco[atual]||[];
      const resto=l.split(/[:：]/).slice(1).join(':').trim();
      if(resto) bloco[atual].push(resto);
      if(achado.k==='criativo'){
        const m=l.match(/(\d+)/); if(m) bloco.num=parseInt(m[1],10);
      }
      return;
    }
    if(atual && l.trim()) bloco[atual].push(l.trim());
  });
  return bloco;
}

function aplicarBriefing(txt){
  const b=lerBriefing(txt);
  const pegou=[], faltou=[];
  const junta=k=>(b[k]||[]).map(normalizarVars).join(' ').trim();
  const lista=k=>(b[k]||[]).map(normalizarVars);

  if(b.num&&b.num>=1&&b.num<=6){ D.tpl=b.num; pegou.push('criativo '+b.num); }

  // CTA — sempre respeitado
  const cta=junta('cta');
  if(cta){ D.cta=cta.replace(/\[.*?\]/g,'').trim()||cta; pegou.push('CTA'); }
  else faltou.push('CTA (mantive o atual)');

  // selo → preços
  const selo=junta('selo');
  if(selo){
    const vals=[...selo.matchAll(/r\$\s*([\d.]+,\d{2})/gi)].map(m=>m[1]);
    const off=selo.match(/(\d{1,2})\s*%/);
    if(vals.length>=2){ D.padrao={de:vals[0],por:vals[1]}; D.de=vals[0]; D.por=vals[1]; pegou.push('preços do selo'); }
    else if(vals.length===1){ D.padrao={de:D.padrao.de,por:vals[0]}; D.por=vals[0]; pegou.push('preço do selo'); }
    if(off){ D.off=off[1]+'%'; }
    if(D.tpl===5) D.t5.selo=selo.replace(/^apenas\s*/i,'').trim()||D.t5.selo;
  }

  const kick=junta('kicker'), head=lista('headline'), sub=lista('sub');

  if(D.tpl===1){
    if(kick){ D.t1.kick=kick; pegou.push('kicker'); }
    if(head.length){ D.t1.head=head.join(' '); pegou.push('headline'); }
    const pares=sub.filter(l=>l.includes('|')).map(l=>l.split('|').map(x=>x.trim()));
    if(pares.length>=2){
      D.t1.colA=pares[0][0]||D.t1.colA; D.t1.colB=pares[0][1]||D.t1.colB;
      ['a1','a2','a3'].forEach((k,i)=>{ if(pares[i+1]) D.t1[k]=pares[i+1][0]||''; });
      ['b1','b2','b3'].forEach((k,i)=>{ if(pares[i+1]) D.t1[k]=pares[i+1][1]||''; });
      pegou.push('tabela comparativa');
    } else if(sub.length) faltou.push('tabela do comparativo — separe as colunas com |');
  }

  if(D.tpl===2){
    if(kick){
      const nome=kick.split('\n')[0].replace(/\[|\]/g,'').replace(/online/i,'')
        .replace(/[^\p{L}\p{N}\s'.-]/gu,'').trim();
      if(nome && !/nome da amiga/i.test(nome)){ D.t2.amiga=nome; pegou.push('nome da amiga'); }
    }
    const bal=lista('baloes').filter(l=>/\[(recebido|enviado)\]/i.test(l));
    if(bal.length){
      D.t2.msgs=bal.map(l=>{
        const env=/\[enviado\]/i.test(l);
        let t=l.replace(/\[(recebido|enviado)\]\s*/i,'').trim();
        if(/^\[?\s*foto\b/i.test(t)) t='[foto]';
        return (env?'e: ':'r: ')+t;
      }).join('\n');
      pegou.push(bal.length+' balões');
    } else faltou.push('balões — precisam vir marcados com [recebido] / [enviado]');
  }

  if(D.tpl===3){
    const cab=lista('cabecalho');
    if(cab.length>1){ D.t3.editoria=cab[cab.length-1].toUpperCase(); pegou.push('editoria'); }
    const ops=head.filter(l=>/^\d+[.)]/.test(l)).map(l=>l.replace(/^\d+[.)]\s*/,''));
    if(ops.length){ D.heads3=ops; D.t3.headIdx=0; pegou.push(ops.length+' headlines'); }
    else if(head.length){ D.heads3=[head.join(' ')]; D.t3.headIdx=0; pegou.push('headline'); }
    if(sub.length){ D.t3.lead=sub.join(' '); pegou.push('subheadline'); }
  }

  if(D.tpl===4){
    if(head.length){ D.t4.head=head.join(' ').toLowerCase(); pegou.push('headline'); }
    sub.forEach(l=>{
      const m=l.match(/^(.+?):\s*(.+)$/);
      if(!m)return;
      const rot=semAcento(m[1]);
      if(rot.includes('efeito')){ D.t4.r1t=m[1]+':'; D.t4.r1=m[2]; }
      else if(rot.includes('nao serve')||rot.includes('para quem')){ D.t4.r2t=m[1]+':'; D.t4.r2=m[2]; }
      else if(rot.includes('valor')||rot.includes('preco')){ D.t4.r3t=m[1]+':'; }
    });
    if(sub.length) pegou.push('nota de papel');
  }

  if(D.tpl===5){
    if(head.length){
      D.t5.head=head[0];
      if(head[1]) D.t5.sub=head.slice(1).join(' ')+(sub.length?' '+sub.join(' '):'');
      pegou.push('headline');
    }
    if(sub.length && !head[1]){ D.t5.sub=sub.join(' '); pegou.push('subheadline'); }
  }

  if(D.tpl===6){
    if(head.length){ D.t6.head=head.join(' '); pegou.push('headline'); }
    if(sub.length){ D.t6.sub=sub.join(' '); pegou.push('subheadline'); }
    const c=junta('cta');
    if(c){
      const partes=c.split(/\n|\[/)[0].trim();
      if(partes) D.t6.lbl=partes;
    }
  }

  return {pegou,faltou};
}

  $('#modalCx').innerHTML=`
  <button class="fechar" data-x>×</button>
  <h3>Colar briefing</h3>
  <p>Cole o bloco do criativo como ele vem no documento — com as palavras CRIATIVO, KICKER, HEADLINE, SUBHEADLINE, BALÕES, SELO e CTA. O motor separa cada parte e preenche a peça sozinho.</p>

}

function trocarModo(m){
  D.modo=m;
  const s=(m==='simples');
  $('#simples').style.display=s?'block':'none';
  $('#abas').style.display=s?'none':'flex';
  $('#campos').style.display=s?'none':'block';
  $$('.soCompleto').forEach(e=>e.style.display=s?'none':'');
  $('#mSimples').classList.toggle('on',s);
  $('#mCompleto').classList.toggle('on',!s);
  if(s) renderSimples();
  salvar();
}
$('#mSimples').onclick=()=>trocarModo('simples');
